<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>RishantCraft</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* ================= START SCREEN ================= */

#home{
  position:fixed;
  inset:0;
  z-index:50;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(70,180,255,.25),transparent 35%),
    linear-gradient(#10283a,#071018);
}

.homeBox{
  width:min(92vw,480px);
  padding:28px;
  border-radius:24px;
  text-align:center;
  background:rgba(8,15,22,.88);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 80px rgba(0,0,0,.65);
}

.homeLogo{
  width:110px;
  height:110px;
  object-fit:cover;
  border-radius:22px;
  margin-bottom:15px;
  box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.homeTitle{
  color:white;
  font-size:34px;
  font-weight:900;
  margin:0 0 8px;
}

.homeSub{
  color:#aebdca;
  font-size:14px;
  margin-bottom:24px;
}

.menuBtn{
  width:100%;
  border:0;
  border-radius:14px;
  padding:15px;
  margin-top:10px;
  color:white;
  background:linear-gradient(135deg,#20a4ff,#1769ff);
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.menuBtn.secondary{
  background:#202b35;
}

.menuBtn:active{
  transform:scale(.97);
}

#audioStatus{
  margin-top:12px;
  min-height:18px;
  color:#8fd5ff;
  font-size:12px;
}

/* ================= ROTATE ================= */

#rotateScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#071018;
  color:white;
  padding:30px;
}

.rotateBox{
  max-width:360px;
}

.phoneIcon{
  font-size:65px;
  animation:rotatePhone 1.8s infinite ease-in-out;
}

@keyframes rotatePhone{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(90deg)}
}

.rotateTitle{
  font-size:25px;
  font-weight:900;
  margin-top:15px;
}

.rotateText{
  color:#9fb0bd;
  line-height:1.5;
  margin-top:10px;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  inset:0;
  z-index:10;
  pointer-events:none;
  display:none;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px black;
}

#crosshair:before{
  width:14px;
  height:2px;
  left:2px;
  top:8px;
}

#crosshair:after{
  width:2px;
  height:14px;
  left:8px;
  top:2px;
}

#topInfo{
  position:absolute;
  top:12px;
  left:12px;
  color:white;
  background:rgba(0,0,0,.42);
  padding:7px 10px;
  border-radius:9px;
  font-size:12px;
}

#targetInfo{
  position:absolute;
  top:48px;
  left:12px;
  color:#dcefff;
  background:rgba(0,0,0,.3);
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
}

/* ================= HOTBAR ================= */

#hotbar{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  display:flex;
  gap:4px;
  padding:6px;
  background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.15);
  border-radius:10px;
}

.slot{
  position:relative;
  width:48px;
  height:48px;
  border:2px solid rgba(255,255,255,.25);
  border-radius:7px;
  background:rgba(35,35,35,.85);
  overflow:hidden;
}

.slot.selected{
  border:3px solid #fff;
  box-shadow:0 0 12px rgba(255,255,255,.5);
}

.slot img{
  width:100%;
  height:100%;
  object-fit:cover;
  image-rendering:auto;
}

.slotNumber{
  position:absolute;
  left:3px;
  top:2px;
  font-size:10px;
  color:white;
  text-shadow:0 1px 2px black;
}

/* ================= PAUSE ================= */

#pause{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.62);
}

.pauseBox{
  width:min(90vw,380px);
  background:#101820;
  color:white;
  padding:25px;
  border-radius:20px;
  text-align:center;
}

.pauseBox h2{
  margin-top:0;
}

/* ================= MOBILE CONTROLS ================= */

#mobileControls{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:24px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.10);
  border:2px solid rgba(255,255,255,.2);
  pointer-events:auto;
}

#joystickKnob{
  position:absolute;
  left:50%;
  top:50%;
  width:54px;
  height:54px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.35);
  border:2px solid rgba(255,255,255,.5);
}

.mobileButton{
  position:absolute;
  width:65px;
  height:65px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.45);
  color:white;
  font-size:12px;
  font-weight:bold;
  pointer-events:auto;
}

#jumpBtn{
  right:25px;
  bottom:120px;
}

#breakBtn{
  right:105px;
  bottom:45px;
}

#placeBtn{
  right:25px;
  bottom:45px;
}

#pauseBtn{
  right:18px;
  top:18px;
  width:46px;
  height:46px;
}

/* ================= LOADING ================= */

#loading{
  position:fixed;
  inset:0;
  z-index:90;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#071018;
  color:white;
}

.loadingBox{
  text-align:center;
}

.loader{
  width:50px;
  height:50px;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.15);
  border-top-color:#38bdf8;
  animation:spin 1s linear infinite;
  margin:auto;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* ================= PORTRAIT MOBILE ================= */

@media (orientation:portrait) and (max-width:900px){
  #rotateScreen{
    display:flex;
  }

  #home{
    display:none !important;
  }

  #hud,
  #mobileControls{
    display:none !important;
  }
}

/* landscape mobile */
@media (orientation:landscape) and (max-width:900px){
  #mobileControls{
    display:block;
  }

  #hotbar{
    bottom:8px;
    transform:translateX(-50%) scale(.82);
    transform-origin:bottom center;
  }

  #topInfo{
    top:6px;
    left:6px;
  }

  #targetInfo{
    top:38px;
    left:6px;
  }
}

/* desktop */
@media (min-width:901px){
  #hotbar{
    bottom:14px;
  }
}
</style>
</head>

<script>
/* ============================================================
   RISHANTCRAFT
   ROOT ASSET STRUCTURE
   ============================================================ */

(() => {

"use strict";

/* ============================================================
   ASSETS
   ============================================================ */

const ASSETS = {
  grass: "tileable_grass_00.png",
  dirt: "dirt1.png",
  stone: "handpaintedwall2.png",
  sand: "Sand2_S.jpg",
  wood: "wood1.jpg",
  leaves: "LongLeaves_S.jpg",
  glass: "Transparent.png",
  brick: "bricksx64.png",
  door: "door.png",
  water: "tex_Water.jpg",
  logo: "logo.png",

  walkSound: "walk.mp3",
  breakSound: "break.mp3",
  backSound: "back.mp3"
};

/* ============================================================
   DOM
   ============================================================ */

const home = document.getElementById("home");
const loading = document.getElementById("loading");
const loadingText = document.getElementById("loadingText");
const playBtn = document.getElementById("playBtn");
const newWorldBtn = document.getElementById("newWorldBtn");
const audioStatus = document.getElementById("audioStatus");

const hud = document.getElementById("hud");
const targetInfo = document.getElementById("targetInfo");

const pause = document.getElementById("pause");
const resumeBtn = document.getElementById("resumeBtn");
const saveBtn = document.getElementById("saveBtn");
const homeBtn = document.getElementById("homeBtn");

const hotbar = document.getElementById("hotbar");

const mobileControls = document.getElementById("mobileControls");
const joystick = document.getElementById("joystick");
const joystickKnob = document.getElementById("joystickKnob");
const jumpBtn = document.getElementById("jumpBtn");
const breakBtn = document.getElementById("breakBtn");
const placeBtn = document.getElementById("placeBtn");
const pauseBtn = document.getElementById("pauseBtn");

/* ============================================================
   AUDIO
   ============================================================ */

const homeMusic = new Audio(ASSETS.backSound);
const walkSound = new Audio(ASSETS.walkSound);
const breakSound = new Audio(ASSETS.breakSound);

homeMusic.loop = true;
homeMusic.volume = 0.30;

walkSound.loop = true;
walkSound.volume = 0.50;

breakSound.volume = 0.75;

homeMusic.preload = "auto";
walkSound.preload = "auto";
breakSound.preload = "auto";

homeMusic.addEventListener("error", () => {

});

walkSound.addEventListener("error", () => {
  audioStatus.textContent = "⚠ walk.mp3 not loaded";
});

breakSound.addEventListener("error", () => {
  audioStatus.textContent = "⚠ break.mp3 not loaded";
});

function playHomeMusic(){

  homeMusic.play().catch(() => {
    audioStatus.textContent =
      "🔊 Click PLAY once to enable audio";
  });

}

function stopHomeMusic(){

  homeMusic.pause();

}

function playWalkSound(){

  if(walkSound.paused){
    walkSound.play().catch(()=>{});
  }

}

function stopWalkSound(){

  if(!walkSound.paused){
    walkSound.pause();
    walkSound.currentTime = 0;
  }

}

function playBreakSound(){

  breakSound.currentTime = 0;

  breakSound.play().catch(()=>{});

}

/* ============================================================
   THREE
   ============================================================ */

let scene;
let camera;
let renderer;

const clock = new THREE.Clock();

const raycaster = new THREE.Raycaster();

const pointer = new THREE.Vector2(0,0);

const worldGroup = new THREE.Group();

scene = new THREE.Scene();

scene.background = new THREE.Color(0x78c8f2);

scene.fog = new THREE.Fog(
  0x78c8f2,
  45,
  190
);

camera = new THREE.PerspectiveCamera(

  0.05,
  500
);

renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(
  window.innerWidth,

);

renderer.setPixelRatio(

);

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.domElement.style.touchAction = "none";

document.body.appendChild(renderer.domElement);

scene.add(worldGroup);

/* ============================================================
   LIGHTING
   ============================================================ */

const hemi = new THREE.HemisphereLight(
  0xbfe9ff,
  0x5b4635,
  1.65
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
  0xffffff,
  2.1
);

sun.position.set(
  80,
  120,
  40
);

scene.add(sun);

/* ============================================================
   TEXTURE LOADING
   ============================================================ */

const textureLoader = new THREE.TextureLoader();

const textures = {};

function fallbackTexture(color){

  const canvas = document.createElement("canvas");

  canvas.width = 32;
  canvas.height = 32;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = color;
  ctx.fillRect(0,0,32,32);

  ctx.fillStyle = "rgba(255,255,255,.08)";

  for(let y=0;y<32;y+=8){

    for(let x=0;x<32;x+=8){

      ctx.fillRect(x,y,4,4);

    }

  }

  const tex = new THREE.CanvasTexture(canvas);

  tex.colorSpace = THREE.SRGBColorSpace;

  return tex;
}

function prepareTexture(tex){

  tex.colorSpace = THREE.SRGBColorSpace;

  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;

  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;

  return tex;
}

function loadTexture(url,fallbackColor){

  return new Promise(resolve => {

    textureLoader.load(
      url,

      texture => {
        resolve(prepareTexture(texture));
      },

      undefined,

      () => {
        console.warn("Texture missing:",url);
        resolve(fallbackTexture(fallbackColor));
      }

    );

  });

}

/* ============================================================
   BLOCK MATERIALS
   ============================================================ */

const materials = {};

const blockColors = {
  grass:"#62a84f",
  dirt:"#8b5a36",
  stone:"#777777",
  sand:"#d9c27c",
  wood:"#87572e",
  leaves:"#3d8d42",
  glass:"#bdefff",
  brick:"#a34b3f",
  water:"#399ddd"
};

async function loadAllTextures(){

  loadingText.textContent = "Loading block textures...";

  textures.grass =
    await loadTexture(ASSETS.grass,blockColors.grass);

  textures.dirt =
    await loadTexture(ASSETS.dirt,blockColors.dirt);

  textures.stone =
    await loadTexture(ASSETS.stone,blockColors.stone);

  textures.sand =
    await loadTexture(ASSETS.sand,blockColors.sand);

  textures.wood =
    await loadTexture(ASSETS.wood,blockColors.wood);

  textures.leaves =
    await loadTexture(ASSETS.leaves,blockColors.leaves);

  textures.glass =
    await loadTexture(ASSETS.glass,blockColors.glass);

  textures.brick =
    await loadTexture(ASSETS.brick,blockColors.brick);

  textures.water =
    await loadTexture(ASSETS.water,blockColors.water);

  textures.door =
    await loadTexture(ASSETS.door,blockColors.wood);

  const common = {
    map:null
  };

  materials.grass =
    new THREE.MeshLambertMaterial({
      map:textures.grass
    });

  materials.dirt =
    new THREE.MeshLambertMaterial({
      map:textures.dirt
    });

  materials.stone =
    new THREE.MeshLambertMaterial({
      map:textures.stone
    });

  materials.sand =
    new THREE.MeshLambertMaterial({
      map:textures.sand
    });

  materials.wood =
    new THREE.MeshLambertMaterial({
      map:textures.wood
    });

  materials.leaves =
    new THREE.MeshLambertMaterial({
      map:textures.leaves,
      transparent:true,
      alphaTest:.05
    });

  materials.glass =
    new THREE.MeshLambertMaterial({
      map:textures.glass,
      transparent:true,
      opacity:.48,
      depthWrite:false,
      side:THREE.DoubleSide
    });

  materials.brick =
    new THREE.MeshLambertMaterial({
      map:textures.brick
    });

  materials.water =
    new THREE.MeshLambertMaterial({
      map:textures.water,
      transparent:true,
      opacity:.62,
      depthWrite:false,
      side:THREE.DoubleSide
    });

}

/* ============================================================
   BLOCK DATA
   ============================================================ */

const BLOCKS = [
  "grass",
  "dirt",
  "stone",
  "sand",
  "wood",
  "leaves",
  "glass",
  "brick",
  "water"
];

const HOTBAR_BLOCKS = [
  "grass",
  "dirt",
  "stone",
  "sand",
  "wood",
  "leaves",
  "glass",
  "brick",
  "door"
];

let selectedSlot = 0;

const cubeGeometry =
  new THREE.BoxGeometry(1,1,1);

/* ============================================================
   HOTBAR
   ============================================================ */

function createHotbar(){

  hotbar.innerHTML = "";

  HOTBAR_BLOCKS.forEach((type,index)=>{

    const slot =
      document.createElement("div");

    slot.className = "slot";

    if(index === selectedSlot){
      slot.classList.add("selected");
    }

    const number =
      document.createElement("div");

    number.className = "slotNumber";

    number.textContent =
      index === 8 ? "9" : String(index+1);

    slot.appendChild(number);

    const img =
      document.createElement("img");

    let imagePath = "";

    if(type === "grass") imagePath=ASSETS.grass;
    if(type === "dirt") imagePath=ASSETS.dirt;
    if(type === "stone") imagePath=ASSETS.stone;
    if(type === "sand") imagePath=ASSETS.sand;
    if(type === "wood") imagePath=ASSETS.wood;
    if(type === "leaves") imagePath=ASSETS.leaves;
    if(type === "glass") imagePath=ASSETS.glass;
    if(type === "brick") imagePath=ASSETS.brick;
    if(type === "door") imagePath=ASSETS.door;

    img.src=imagePath;

    img.onerror=()=>{
      img.style.display="none";
    };

    slot.appendChild(img);

    slot.addEventListener("click",()=>{

      selectedSlot=index;
      updateHotbar();

    });

    hotbar.appendChild(slot);

  });

}

function updateHotbar(){

  [...hotbar.children].forEach(
    (slot,index)=>{
      slot.classList.toggle(
        "selected",
        index===selectedSlot
      );
    }
  );

}

/* ============================================================
   WORLD
   ============================================================ */

const CHUNK_SIZE = 16;

const RENDER_DISTANCE = 2;

const SEA_LEVEL = 5;

const WORLD_HEIGHT = 22;

let worldSeed =
  Math.floor(Math.random()*4294967295);

let chunks = new Map();

let edits = new Map();

let villageKeys = new Set();

let doorSpecs = new Map();

let doorObjects = new Map();

let villagers = [];

let villagerSpecs = new Map();

const SAVE_KEY = "RISHANTCRAFT_SAVE_V6";

/* ============================================================
   HASH / NOISE
   ============================================================ */

function hash2(x,z){

  let n =
    Math.imul(
      x,
      374761393
    ) ^
    Math.imul(
      z,
      668265263
    ) ^
    worldSeed;

  n =
    Math.imul(
      n ^ (n >>> 13),
      1274126177
    );

  n =
    Math.imul(
      n ^ (n >>> 16),
      2246822519
    );

  return (
    (n >>> 0) /
    4294967296
  );

}

function lerp(a,b,t){

  return a + (b-a)*t;

}

function smooth(t){

  return t*t*(3-2*t);

}

function valueNoise(x,z){

  const x0=Math.floor(x);
  const z0=Math.floor(z);

  const x1=x0+1;
  const z1=z0+1;

  const tx=smooth(x-x0);
  const tz=smooth(z-z0);

  const a=hash2(x0,z0);
  const b=hash2(x1,z0);
  const c=hash2(x0,z1);
  const d=hash2(x1,z1);

  return lerp(
    lerp(a,b,tx),
    lerp(c,d,tx),
    tz
  );

}

/* ============================================================
   TERRAIN
   ============================================================ */

function isRiver(x,z){

  const wave =
    Math.sin(
      z*.035 +
      Math.sin(x*.018)*2.4
    );

  return Math.abs(wave) < .14;

}

function isLake(x,z){

  return valueNoise(
    x*.018,
    z*.018
  ) > .77;

}

function terrainHeight(x,z){

  let n =
    valueNoise(x*.035,z*.035)*4.5;

  n +=
    valueNoise(x*.085,z*.085)*2;

  n +=
    Math.sin(x*.018)*1.3;

  n +=
    Math.cos(z*.021)*1.2;

  let h =
    Math.floor(6+n);

  if(isRiver(x,z)){
    h -= 4;
  }

  if(isLake(x,z)){
    h -= 3;
  }

  h=Math.max(1,Math.min(14,h));

  return h;

}

function nearWater(x,z){

  for(let dx=-2;dx<=2;dx++){

    for(let dz=-2;dz<=2;dz++){

      if(
        terrainHeight(
          x+dx,
          z+dz
        ) < SEA_LEVEL
      ){
        return true;
      }

    }

  }

  return false;

}

/* ============================================================
   TREES
   ============================================================ */

function treeRoot(rx,rz){

  const h =
    terrainHeight(rx,rz);

  if(h<=SEA_LEVEL){
    return false;
  }

  if(
    hash2(rx*3+17,rz*5-11) < .88
  ){
    return false;
  }

  for(let dx=-2;dx<=2;dx++){

    for(let dz=-2;dz<=2;dz++){

      if(dx===0 && dz===0) continue;

      if(
        hash2(
          (rx+dx)*3+17,
          (rz+dz)*5-11
        ) > .92
      ){
        return false;
      }

    }

  }

  return true;

}

function treeBlockAt(x,y,z){

  for(let rx=x-2;rx<=x+2;rx++){

    for(let rz=z-2;rz<=z+2;rz++){

      if(!treeRoot(rx,rz)) continue;

      const ground =
        terrainHeight(rx,rz);

      const trunkTop =
        ground+4;

      if(
        x===rx &&
        z===rz &&
        y>=ground+1 &&
        y<=ground+4
      ){
        return "wood";
      }

      const dy =
        y-trunkTop;

      if(
        dy>=-1 &&
        dy<=2
      ){

        const radius =
          dy>=1 ? 1 : 2;

        if(
          Math.abs(x-rx)<=radius &&
          Math.abs(z-rz)<=radius
        ){

          if(
            Math.abs(x-rx)+
            Math.abs(z-rz)<=radius+1
          ){
            return "leaves";
          }

        }

      }

    }

  }

  return null;

}

/* ============================================================
   BASE BLOCK
   ============================================================ */

function baseBlockAt(x,y,z){

  if(y<0){
    return "stone";
  }

  if(y>=WORLD_HEIGHT){
    return "air";
  }

  const tree =
    treeBlockAt(x,y,z);

  if(tree){
    return tree;
  }

  const h =
    terrainHeight(x,z);

  if(y<=h){

    if(y===h){

      if(
        h<=SEA_LEVEL+1 ||
        nearWater(x,z)
      ){
        return "sand";
      }

      return "grass";

    }

    if(y>=h-2){
      return "dirt";
    }

    return "stone";

  }

  /* normal water */

  if(
    h<SEA_LEVEL &&
    y<=SEA_LEVEL
  ){
    return "water";
  }

  /* waterfall */

  const maxNeighbour =
    Math.max(
      terrainHeight(x+1,z),
      terrainHeight(x-1,z),
      terrainHeight(x,z+1),
      terrainHeight(x,z-1)
    );

  if(
    h<SEA_LEVEL &&
    maxNeighbour-h>=4 &&
    y<=h+5
  ){
    return "water";
  }

  return "air";

}

/* ============================================================
   EDIT SYSTEM
   ============================================================ */

function blockKey(x,y,z){

  return `${x},${y},${z}`;

}

function getBlock(x,y,z){

  const key =
    blockKey(x,y,z);

  if(edits.has(key)){
    return edits.get(key);
  }

  return baseBlockAt(x,y,z);

}

function setBlock(x,y,z,type){

  edits.set(
    blockKey(x,y,z),
    type
  );

  rebuildAround(
    x,y,z
  );

}

/* ============================================================
   CHUNK HELPERS
   ============================================================ */

function chunkCoord(v){

  return Math.floor(
    v/CHUNK_SIZE
  );

}

function chunkKey(cx,cz){

  return `${cx},${cz}`;

}

function isTransparent(type){

  return (
    type==="air" ||
    type==="water" ||
    type==="glass" ||
    type==="leaves"
  );

}

function isSolid(type){

  return (
    type!=="air" &&
    type!=="water"
  );

}

function exposedBlock(x,y,z,type){

  const neighbours=[
    getBlock(x+1,y,z),
    getBlock(x-1,y,z),
    getBlock(x,y+1,z),
    getBlock(x,y-1,z),
    getBlock(x,y,z+1),
    getBlock(x,y,z-1)
  ];

  if(type==="water"){

    return neighbours.some(
      n=>n==="air" || n!=="water"
    );

  }

  return neighbours.some(
    n=>isTransparent(n)
  );

}

/* ============================================================
   CHUNK BUILD
   ============================================================ */

function rebuildChunk(cx,cz){

  const key =
    chunkKey(cx,cz);

  const old =
    chunks.get(key);

  if(old){

    worldGroup.remove(old.group);

  }

  const group =
    new THREE.Group();

  group.name =
    "chunk_"+key;

  const buckets={};

  BLOCKS.forEach(
    type=>{
      buckets[type]=[];
    }
  );

  const startX =
    cx*CHUNK_SIZE;

  const startZ =
    cz*CHUNK_SIZE;

  for(
    let x=startX;
    x<startX+CHUNK_SIZE;
    x++
  ){

    for(
      let z=startZ;
      z<startZ+CHUNK_SIZE;
      z++
    ){

      for(
        let y=0;
        y<WORLD_HEIGHT;
        y++
      ){

        const type =
          getBlock(x,y,z);

        if(type==="air") continue;

        if(
          !exposedBlock(
            x,y,z,type
          )
        ){
          continue;
        }

        buckets[type].push({
          x,y,z
        });

      }

    }

  }

  Object.keys(buckets).forEach(type=>{

    const arr =
      buckets[type];

    if(!arr.length) return;

    const mesh =
      new THREE.InstancedMesh(
        cubeGeometry,
        materials[type],
        arr.length
      );

    mesh.instanceMatrix.setUsage(
      THREE.DynamicDrawUsage
    );

    const matrix =
      new THREE.Matrix4();

    arr.forEach(
      (p,index)=>{

        matrix.makeTranslation(
          p.x+.5,
          p.y+.5,
          p.z+.5
        );

        mesh.setMatrixAt(
          index,
          matrix
        );

      }
    );

    mesh.instanceMatrix.needsUpdate=true;

    mesh.userData.blockPositions=arr;
    mesh.userData.blockType=type;

    group.add(mesh);

  });

  worldGroup.add(group);

  chunks.set(
    key,
    {
      cx,
      cz,
      group
    }
  );

}

/* ============================================================
   REBUILD NEIGHBOURS
   ============================================================ */

function rebuildAround(x,y,z){

  const cx =
    chunkCoord(x);

  const cz =
    chunkCoord(z);

  for(let dx=-1;dx<=1;dx++){

    for(let dz=-1;dz<=1;dz++){

      const key =
        chunkKey(
          cx+dx,
          cz+dz
        );

      if(chunks.has(key)){

        rebuildChunk(
          cx+dx,
          cz+dz
        );

      }

    }

  }

}

/* ============================================================
   VILLAGES
   ============================================================ */

function villageChance(cx,cz){

  return hash2(
    cx*41+7,
    cz*67-3
  );

}

function makeHouse(
  hx,
  hz,
  ground,
  id
){

  const width=5;
  const depth=5;
  const wallHeight=3;

  /* floor */

  for(
    let x=hx;
    x<hx+width;
    x++
  ){

    for(
      let z=hz;
      z<hz+depth;
      z++
    ){

      setEdit(
        x,
        ground,
        z,
        "wood"
      );

    }

  }

  /* walls */

  for(
    let y=ground+1;
    y<=ground+wallHeight;
    y++
  ){

    for(
      let x=hx;
      x<hx+width;
      x++
    ){

      for(
        let z=hz;
        z<hz+depth;
        z++
      ){

        const edge =
          x===hx ||
          x===hx+width-1 ||
          z===hz ||
          z===hz+depth-1;

        if(!edge) continue;

        setEdit(
          x,
          y,
          z,
          "wood"
        );

      }

    }

  }

  /* roof */

  for(
    let x=hx-1;
    x<=hx+width;
    x++
  ){

    for(
      let z=hz-1;
      z<=hz+depth;
      z++
    ){

      setEdit(
        x,
        ground+wallHeight+1,
        z,
        "brick"
      );

    }

  }

  /* door opening */

  const doorX =
    hx+2;

  const doorZ =
    hz;

  setEdit(
    doorX,
    ground+1,
    doorZ,
    "air"
  );

  setEdit(
    doorX,
    ground+2,
    doorZ,
    "air"
  );

  addDoorSpec({
    id:id+"_door",
    x:doorX,
    y:ground+1,
    z:doorZ,
    rotation:0,
    open:false,
    custom:false
  });

}

/* helper because setBlock rebuilds too much during village creation */

function setEdit(x,y,z,type){

  edits.set(
    blockKey(x,y,z),
    type
  );

}

function addDoorSpec(spec){

  doorSpecs.set(
    spec.id,
    spec
  );

}

function generateVillage(cx,cz){

  const key =
    chunkKey(cx,cz);

  if(villageKeys.has(key)){
    return false;
  }

  villageKeys.add(key);

  const chance =
    villageChance(cx,cz);

  if(chance > .14){
    return false;
  }

  const centerX =
    cx*CHUNK_SIZE+8;

  const centerZ =
    cz*CHUNK_SIZE+8;

  const centerH =
    terrainHeight(
      centerX,
      centerZ
    );

  if(centerH<=SEA_LEVEL+1){
    return false;
  }

  const base =
    centerH;

  makeHouse(
    centerX-10,
    centerZ-3,
    terrainHeight(centerX-10,centerZ-3),
    key+"_A"
  );

  makeHouse(
    centerX+5,
    centerZ-3,
    terrainHeight(centerX+5,centerZ-3),
    key+"_B"
  );

  makeHouse(
    centerX-3,
    centerZ+7,
    terrainHeight(centerX-3,centerZ+7),
    key+"_C"
  );

  /* villagers */

  addVillagerSpec(
    key+"_V1",
    centerX-8,
    centerZ
  );

  addVillagerSpec(
    key+"_V2",
    centerX+8,
    centerZ
  );

  return true;

}

/* ============================================================
   VILLAGERS
   ============================================================ */

function addVillagerSpec(id,x,z){

  const h =
    terrainHeight(
      Math.floor(x),
      Math.floor(z)
    );

  if(h<=SEA_LEVEL){
    return;
  }

  villagerSpecs.set(
    id,
    {
      id,
      x,
      y:h+1,
      z,
      homeX:x,
      homeZ:z,
      targetX:x,
      targetZ:z,
      timer:Math.random()*3
    }
  );

}

function createVillagerSprite(spec){

  const canvas =
    document.createElement("canvas");

  canvas.width=64;
  canvas.height=96;

  const ctx =
    canvas.getContext("2d");

  /* original simple villager texture */

  ctx.fillStyle="#7b4d2a";
  ctx.fillRect(18,10,28,25);

  ctx.fillStyle="#d39b68";
  ctx.fillRect(20,14,24,20);

  ctx.fillStyle="#111";
  ctx.fillRect(25,21,4,4);
  ctx.fillRect(36,21,4,4);

  ctx.fillStyle="#5c3a22";
  ctx.fillRect(20,35,24,28);

  ctx.fillStyle="#263d7b";
  ctx.fillRect(20,63,10,24);
  ctx.fillRect(34,63,10,24);

  const tex =
    new THREE.CanvasTexture(canvas);

  tex.colorSpace =
    THREE.SRGBColorSpace;

  const mat =
    new THREE.SpriteMaterial({
      map:tex,
      transparent:true
    });

  const sprite =
    new THREE.Sprite(mat);

  sprite.scale.set(
    1.0,
    1.7,
    1
  );

  sprite.userData.villagerId =
    spec.id;

  return sprite;

}

function syncVillagers(){

  villagers.forEach(v=>{
    v.sprite.removeFromParent();
  });

  villagers=[];

  villagerSpecs.forEach(spec=>{

    const cx =
      chunkCoord(spec.x);

    const cz =
      chunkCoord(spec.z);

    if(
      !chunks.has(
        chunkKey(cx,cz)
      )
    ){
      return;
    }

    const sprite =
      createVillagerSprite(spec);

    sprite.position.set(
      spec.x+.5,
      spec.y+0.8,
      spec.z+.5
    );

    scene.add(sprite);

    villagers.push({
      spec,
      sprite
    });

  });

}

/* ============================================================
   DOORS
   ============================================================ */

function createDoorObject(spec){

  const pivot =
    new THREE.Group();

  pivot.position.set(
    spec.x+.02,
    spec.y,
    spec.z+.03
  );

  const geometry =
    new THREE.PlaneGeometry(
      .95,
      1.95
    );

  const material =
    new THREE.MeshLambertMaterial({
      map:textures.door,
      transparent:true,
      side:THREE.DoubleSide
    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    .475,
    .975,
    0
  );

  mesh.rotation.y =
    spec.rotation || 0;

  mesh.userData.doorId =
    spec.id;

  pivot.add(mesh);

  pivot.rotation.y =
    spec.open
      ? Math.PI/2
      : 0;

  pivot.userData.doorId =
    spec.id;

  pivot.userData.currentAngle =
    spec.open
      ? Math.PI/2
      : 0;

  pivot.userData.targetAngle =
    spec.open
      ? Math.PI/2
      : 0;

  return pivot;

}

function syncDoors(){

  doorObjects.forEach(obj=>{
    obj.removeFromParent();
  });

  doorObjects.clear();

  doorSpecs.forEach(spec=>{

    const cx =
      chunkCoord(spec.x);

    const cz =
      chunkCoord(spec.z);

    if(
      !chunks.has(
        chunkKey(cx,cz)
      )
    ){
      return;
    }

    const object =
      createDoorObject(spec);

    scene.add(object);

    doorObjects.set(
      spec.id,
      object
    );

  });

}

function toggleDoor(id){

  const spec =
    doorSpecs.get(id);

  const obj =
    doorObjects.get(id);

  if(!spec || !obj){
    return;
  }

  spec.open =
    !spec.open;

  obj.userData.targetAngle =
    spec.open
      ? Math.PI/2
      : 0;

}

function updateDoors(dt){

  doorObjects.forEach(
    (obj,id)=>{

      const target =
        obj.userData.targetAngle;

      let current =
        obj.userData.currentAngle;

      current +=
        (target-current) *
        Math.min(1,dt*10);

      obj.userData.currentAngle =
        current;

      obj.rotation.y =
        current;

    }
  );

}

/* ============================================================
   CHUNK STREAMING
   ============================================================ */

let lastChunkX=999999;
let lastChunkZ=999999;

function updateChunks(){

  const pcx =
    chunkCoord(player.x);

  const pcz =
    chunkCoord(player.z);

  if(
    pcx===lastChunkX &&
    pcz===lastChunkZ
  ){
    return;
  }

  lastChunkX=pcx;
  lastChunkZ=pcz;

  let newVillage=false;

  for(
    let dx=-RENDER_DISTANCE;
    dx<=RENDER_DISTANCE;
    dx++
  ){

    for(
      let dz=-RENDER_DISTANCE;
      dz<=RENDER_DISTANCE;
      dz++
    ){

      const cx=pcx+dx;
      const cz=pcz+dz;

      const key=
        chunkKey(cx,cz);

      if(!chunks.has(key)){

        if(
          generateVillage(cx,cz)
        ){
          newVillage=true;
        }

        rebuildChunk(cx,cz);

      }

    }

  }

  /* unload */

  const unloadDistance =
    RENDER_DISTANCE+1;

  [...chunks.entries()].forEach(
    ([key,data])=>{

      if(
        Math.abs(data.cx-pcx)>
        unloadDistance ||
        Math.abs(data.cz-pcz)>
        unloadDistance
      ){

        worldGroup.remove(
          data.group
        );

        chunks.delete(key);

      }

    }
  );

  if(newVillage){

    chunks.forEach(data=>{
      rebuildChunk(
        data.cx,
        data.cz
      );
    });

  }

  syncDoors();
  syncVillagers();

}

const player = {

  z:.5,

  velocityY:0,

  radius:.28,

  onGround:false

};

let yaw=0;

let pitch=0;

const keys={};

let gameRunning=false;

let gamePaused=false;

/* ============================================================
   COLLISION
   ============================================================ */

function doorCollision(px,py,pz){

  for(
    const spec of doorSpecs.values()
  ){

    if(spec.open) continue;

    const dx =
      Math.abs(
        px-(spec.x+.5)
      );

    const dz =
      Math.abs(
        pz-(spec.z+.5)
      );

    if(
      dx<.48 &&
      dz<.48 &&
      py < spec.y+1.9 &&
      py+1.8 > spec.y
    ){
      return true;
    }

  }

  return false;

}

function collides(px,py,pz){

  const minX =
    Math.floor(
      px-player.radius
    );

  const maxX =
    Math.floor(
      px+player.radius
    );

  const minY =
    Math.floor(py+.02);

  const maxY =
    Math.floor(
      py+player.height-.02
    );

  const minZ =
    Math.floor(
      pz-player.radius
    );

  const maxZ =
    Math.floor(
      pz+player.radius
    );

  for(
    let x=minX;
    x<=maxX;
    x++
  ){

    for(
      let y=minY;
      y<=maxY;
      y++
    ){

      for(
        let z=minZ;
        z<=maxZ;
        z++
      ){

        const type =
          getBlock(x,y,z);

        if(isSolid(type)){
          return true;
        }

      }

    }

  }

  if(
    doorCollision(
      px,py,pz
    )
  ){
    return true;
  }

  return false;

}

/* ============================================================
   MOVE
   ============================================================ */

const forward =
  new THREE.Vector3();

const right =
  new THREE.Vector3();

function movePlayer(dt){

  let inputX=0;
  let inputZ=0;

  if(keys["KeyW"]) inputZ += 1;
  if(keys["KeyS"]) inputZ -= 1;
  if(keys["KeyA"]) inputX -= 1;
  if(keys["KeyD"]) inputX += 1;

  /* mobile joystick */

  inputX += mobileInput.x;
  inputZ += mobileInput.y;

  inputX =
    THREE.MathUtils.clamp(
      inputX,-1,1
    );

  inputZ =
    THREE.MathUtils.clamp(
      inputZ,-1,1
    );

  let moving =
    Math.abs(inputX)>.05 ||
    Math.abs(inputZ)>.05;

  if(moving){

    const length =
      Math.hypot(
        inputX,
        inputZ
      );

    inputX/=length;
    inputZ/=length;

  }

  /* camera forward */

  forward.set(
    0,
    0,
    -1
  );

  forward.applyAxisAngle(
    new THREE.Vector3(0,1,0),
    yaw
  );

  forward.y=0;
  forward.normalize();

  right.set(
    forward.z,
    0,
    -forward.x
  );

  let moveX =
    (
      forward.x*inputZ +
      right.x*inputX
    );

  let moveZ =
    (
      forward.z*inputZ +
      right.z*inputX
    );

  const sneak =
    keys["ShiftLeft"] ||
    keys["ShiftRight"];

  const sprint =
    (
      keys["ControlLeft"] ||
      keys["ControlRight"]
    ) &&
    !sneak;

  let speed=5.0;

  if(sneak){
    speed=2.2;
  }

  if(sprint){
    speed=7.0;
  }

  const dx =
    moveX*speed*dt;

  const dz =
    moveZ*speed*dt;

  /* horizontal collision with step-up */

  if(dx!==0){

    if(
      !collides(
        player.x+dx,
        player.y,
        player.z
      )
    ){

      player.x+=dx;

    }else if(
      player.onGround &&
      !collides(
        player.x+dx,
        player.y+.65,
        player.z
      )
    ){

      player.y+=.65;
      player.x+=dx;

    }

  }

  if(dz!==0){

    if(
      !collides(
        player.x,
        player.y,
        player.z+dz
      )
    ){

      player.z+=dz;

    }else if(
      player.onGround &&
      !collides(
        player.x,
        player.y+.65,
        player.z+dz
      )
    ){

      player.y+=.65;
      player.z+=dz;

    }

  }

  /* gravity */

  player.velocityY -=
    22*dt;

  if(
    mobileJump ||
    (
      keys["Space"] &&
      player.onGround
    )
  ){

    player.velocityY=8.3;

    player.onGround=false;

    mobileJump=false;

  }

  const newY =
    player.y+
    player.velocityY*dt;

  if(
    !collides(
      player.x,
      newY,
      player.z
    )
  ){

    player.y=newY;
    player.onGround=false;

  }else{

    if(player.velocityY<0){

      player.y=
        Math.floor(
          player.y
        );

      player.onGround=true;

    }

    player.velocityY=0;

  }

  /* prevent falling endlessly */

  if(player.y<-10){

    player.y=
      terrainHeight(
        Math.floor(player.x),
        Math.floor(player.z)
      )+1;

    player.velocityY=0;

  }

  /* walking sound */

  if(
    moving &&
    player.onGround
  ){

    playWalkSound();

  }else{

    stopWalkSound();

  }

}

);

      document.pointerLockElement ===
      renderer.domElement;

      gameRunning &&
      !pointerLocked &&
      !isTouchDevice()
    ){

);

  e=>{

    if(!pointerLocked) return;

    yaw -=
      e.movementX*.0025;

    pitch -=
      e.movementY*.0025;

    pitch =
      THREE.MathUtils.clamp(
        pitch,
        -Math.PI/2+.05,
        Math.PI/2-.05
      );

  }
);

   ============================================================ */

let lookTouch=null;

renderer.domElement.addEventListener(
  "touchstart",
  e=>{

    if(!gameRunning || gamePaused) return;

    if(e.touches.length!==1) return;

    const t=e.touches[0];

    lookTouch={
      id:t.identifier,
      x:t.clientX,
      y:t.clientY
    };

  },
  {passive:false}
);

renderer.domElement.addEventListener(
  "touchmove",
  e=>{

    if(!lookTouch) return;

    for(
      const t of e.touches
    ){

      if(
        t.identifier===
        lookTouch.id
      ){

        const dx =
          t.clientX-lookTouch.x;

        const dy =
          t.clientY-lookTouch.y;

        /* only look with larger movement */

        yaw -= dx*.004;

        pitch -= dy*.003;

        pitch =
          THREE.MathUtils.clamp(
            pitch,
            -Math.PI/2+.05,
            Math.PI/2-.05
          );

        lookTouch.x=t.clientX;
        lookTouch.y=t.clientY;

        e.preventDefault();

      }

    }

  },
  {passive:false}
);

renderer.domElement.addEventListener(
  "touchend",
  ()=>{
    lookTouch=null;

);

const mobileInput={
  x:0,
  y:0
};

let joystickActive=false;

function updateJoystick(clientX,clientY){

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left+rect.width/2;

  const centerY =
    rect.top+rect.height/2;

  let dx =
    clientX-centerX;

  let dy =
    clientY-centerY;

  const max =
    rect.width*.34;

  const length =
    Math.hypot(dx,dy);

  if(length>max){

    dx=
      dx/length*max;

    dy=
      dy/length*max;

  }

  mobileInput.x =
    dx/max;

  /* up = forward */

  mobileInput.y =
    -dy/max;

  joystickKnob.style.transform =
    `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

}

joystick.addEventListener(
  "touchstart",
  e=>{

    joystickActive=true;

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );

    e.preventDefault();

  },
  {passive:false}
);

joystick.addEventListener(
  "touchmove",
  e=>{

    if(!joystickActive) return;

    const t=e.touches[0];

    updateJoystick(
      t.clientX,
      t.clientY
    );

    e.preventDefault();

  },
  {passive:false}
);

function resetJoystick(){

  joystickActive=false;

  mobileInput.x=0;
  mobileInput.y=0;

  joystickKnob.style.transform=
    "translate(-50%,-50%)";

}

joystick.addEventListener(

  resetJoystick
);

);

/* ============================================================
   BLOCK RAYCAST
   ============================================================ */

function getRayObjects(){

  const objects=[];

  chunks.forEach(
    chunk=>{

      chunk.group.children.forEach(
        child=>{
          objects.push(child);
        }
      );

    }
  );

  doorObjects.forEach(
    object=>{
      object.traverse(
        child=>{
          if(child.isMesh){
            objects.push(child);
          }
        }
      );
    }
  );

  return objects;

}

function getTarget(){

  raycaster.setFromCamera(
    pointer,
    camera
  );

  const objects =
    getRayObjects();

  const hits =
    raycaster.intersectObjects(
      objects,
      false
    );

  if(!hits.length){
    return null;
  }

  for(
    const hit of hits
  ){

    /* door */

    if(
      hit.object.userData &&
      hit.object.userData.doorId
    ){

      return {
        type:"door",
        id:hit.object.userData.doorId,
        distance:hit.distance
      };

    }

    /* block */

    if(
      hit.object.isInstancedMesh &&
      hit.instanceId!==undefined
    ){

      const arr =
        hit.object.userData.blockPositions;

      const pos =
        arr[hit.instanceId];

      if(!pos) continue;

      const normal =
        hit.face ?
        hit.face.normal.clone() :
        new THREE.Vector3(0,1,0);

      return {
        type:"block",
        x:pos.x,
        y:pos.y,
        z:pos.z,
        block:pos.type || hit.object.userData.blockType,
        normal,
        distance:hit.distance
      };

    }

  }

  return null;

}

/* ============================================================
   BREAK ANIMATION
   ============================================================ */

let breaking=null;

let crackGroup=null;

const crackMaterials=[];

function createCrackTexture(stage){

  const canvas =
    document.createElement("canvas");

  canvas.width=128;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,
    0,
    128,
    128
  );

  ctx.strokeStyle=
    "rgba(10,10,10,.95)";

  ctx.lineWidth=3;

  ctx.lineCap="round";

  const lines=[
    [
      [15,18],
      [40,48],
      [31,78],
      [61,101]
    ],
    [
      [95,14],
      [75,42],
      [89,65],
      [63,85],
      [70,116]
    ],
    [
      [15,90],
      [42,75],
      [61,54],
      [110,40]
    ],
    [
      [25,25],
      [63,33],
      [96,90]
    ],
    [
      [105,110],
      [80,82],
      [55,92],
      [20,110]
    ]
  ];

  const count =
    Math.min(
      stage+1,
      lines.length
    );

  for(let i=0;i<count;i++){

    const line=lines[i];

    ctx.beginPath();

    line.forEach(
      (p,index)=>{

        if(index===0){
          ctx.moveTo(
            p[0],
            p[1]
          );
        }else{
          ctx.lineTo(
            p[0],
            p[1]
          );
        }

      }
    );

    ctx.stroke();

  }

  const tex =
    new THREE.CanvasTexture(
      canvas
    );

  tex.colorSpace=
    THREE.SRGBColorSpace;

  return tex;

}

function makeCrackFace(
  position,
  rotation
){

  const tex =
    createCrackTexture(
      breaking.stage
    );

  const material =
    new THREE.MeshBasicMaterial({
      map:tex,
      transparent:true,
      opacity:.9,
      depthWrite:false,
      side:THREE.DoubleSide
    });

  const plane =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.01,
        1.01
      ),
      material
    );

  plane.position.copy(
    position
  );

  plane.rotation.set(
    rotation.x,
    rotation.y,
    rotation.z
  );

  return plane;

}

function createCrackGroup(x,y,z){

  if(crackGroup){

    scene.remove(
      crackGroup
    );

  }

  crackGroup =
    new THREE.Group();

  const p=.506;

  const faces=[

    {
      pos:new THREE.Vector3(.5,0,0),
      rot:new THREE.Euler(0,Math.PI/2,0)
    },

    {
      pos:new THREE.Vector3(-.5,0,0),
      rot:new THREE.Euler(0,Math.PI/2,0)
    },

    {
      pos:new THREE.Vector3(0,.5,0),
      rot:new THREE.Euler(Math.PI/2,0,0)
    },

    {
      pos:new THREE.Vector3(0,-.5,0),
      rot:new THREE.Euler(Math.PI/2,0,0)
    },

    {
      pos:new THREE.Vector3(0,0,.5),
      rot:new THREE.Euler(0,0,0)
    },

    {
      pos:new THREE.Vector3(0,0,-.5),
      rot:new THREE.Euler(0,0,0)
    }

  ];

  faces.forEach(face=>{

    const mesh =
      makeCrackFace(
        face.pos,
        face.rot
      );

    crackGroup.add(mesh);

  });

  crackGroup.position.set(
    x+.5,
    y+.5,
    z+.5
  );

  scene.add(
    crackGroup
  );

}

function startBreaking(target){

  if(breaking) return;

  if(target.type!=="block") return;

  if(
    target.block==="water" ||
    target.block==="air"
  ){
    return;
  }

  breaking={
    x:target.x,
    y:target.y,
    z:target.z,
    block:target.block,
    progress:0,
    stage:0,
    duration:.38
  };

  createCrackGroup(
    target.x,
    target.y,
    target.z
  );

}

function updateBreaking(dt){

  if(!breaking) return;

  /* cancel if player looks away */

  const target =
    getTarget();

  if(
    !target ||
    target.type!=="block" ||
    target.x!==breaking.x ||
    target.y!==breaking.y ||
    target.z!==breaking.z
  ){

    if(crackGroup){

      scene.remove(
        crackGroup
      );

      crackGroup=null;

    }

    breaking=null;

    return;

  }

  breaking.progress += dt;

  const newStage =
    Math.min(
      4,
      Math.floor(
        breaking.progress/
        breaking.duration*5
      )
    );

  if(newStage!==breaking.stage){

    breaking.stage=newStage;

    createCrackGroup(
      breaking.x,
      breaking.y,
      breaking.z
    );

  }

  if(
    breaking.progress >=
    breaking.duration
  ){

    setBlock(
      breaking.x,
      breaking.y,
      breaking.z,
      "air"
    );

    playBreakSound();

    if(crackGroup){

      scene.remove(
        crackGroup
      );

      crackGroup=null;

    }

    breaking=null;

  }

}

/* ============================================================
   BREAK / PLACE
   ============================================================ */

function breakTarget(){

  const target =
    getTarget();

  if(!target) return;

  if(
    target.type==="door"
  ){

    doorSpecs.delete(
      target.id
    );

    const object =
      doorObjects.get(
        target.id
      );

    if(object){

      object.removeFromParent();

    }

    doorObjects.delete(
      target.id
    );

    playBreakSound();

    return;

  }

  startBreaking(target);

}

function placeTarget(){

  const target =
    getTarget();

  if(!target) return;

  if(
    target.type==="door"
  ){

    toggleDoor(
      target.id
    );

    return;

  }

  const type =
    HOTBAR_BLOCKS[
      selectedSlot
    ];

  const nx =
    target.x+
    Math.round(
      target.normal.x
    );

  const ny =
    target.y+
    Math.round(
      target.normal.y
    );

  const nz =
    target.z+
    Math.round(
      target.normal.z
    );

  if(type==="door"){

    placeDoor(
      nx,
      ny,
      nz,
      target.normal
    );

    return;

  }

  if(
    getBlock(
      nx,ny,nz
    )!=="air" &&
    getBlock(
      nx,ny,nz
    )!=="water"
  ){
    return;
  }

  /* don't place inside player */

  if(
    collides(
      player.x,
      player.y,
      player.z
    )
  ){
    return;
  }

  setBlock(
    nx,
    ny,
    nz,
    type
  );

}

/* ============================================================
   DOOR PLACEMENT
   ============================================================ */

function placeDoor(
  x,
  y,
  z,
  normal
){

  if(
    Math.abs(normal.y)>.5
  ){
    return;
  }

  if(
    getBlock(x,y,z)!=="air" &&
    getBlock(x,y,z)!=="water"
  ){
    return;
  }

  if(
    getBlock(x,y+1,z)!=="air" &&
    getBlock(x,y+1,z)!=="water"
  ){
    return;
  }

  if(
    !isSolid(
      getBlock(x,y-1,z)
    )
  ){
    return;
  }

  const id =
    "custom_"+Date.now();

  const rotation =
    Math.abs(normal.x)>.5
      ? Math.PI/2
      : 0;

  doorSpecs.set(
    id,
    {
      id,
      x,
      y,
      z,
      rotation,
      open:false,
      custom:true
    }
  );

  edits.set(
    blockKey(x,y,z),
    "air"
  );

  edits.set(
    blockKey(x,y+1,z),
    "air"
  );

  rebuildAround(
    x,y,z
  );

  syncDoors();

}

   ============================================================ */

function saveWorld(){

  const data={

    seed:worldSeed,

    edits:
      [...edits.entries()],

    customDoors:
      [...doorSpecs.values()]
      .filter(d=>d.custom)

  };

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(data)
  );

}

function loadWorld(){

  try{

    const raw =
      localStorage.getItem(
        SAVE_KEY
      );

    if(!raw){
      return;
    }

    const data =
      JSON.parse(raw);

    if(data.seed){
      worldSeed=data.seed;
    }

    edits.clear();

    if(Array.isArray(data.edits)){

      data.edits.forEach(
        item=>{
          edits.set(
            item[0],
            item[1]
          );
        }
      );

    }

    doorSpecs.clear();

    if(
      Array.isArray(
        data.customDoors
      )
    ){

      data.customDoors.forEach(
        door=>{
          doorSpecs.set(
            door.id,
            door
          );
        }
      );

    }

  }catch(err){

    console.warn(
      "Save load error",
      err
    );

  }

}

function newWorld(){

  worldSeed =
    Math.floor(
      Math.random()*
      4294967295
    );

  edits.clear();

  doorSpecs.clear();

  villageKeys.clear();

  villagerSpecs.clear();

  chunks.forEach(
    chunk=>{
      worldGroup.remove(
        chunk.group
      );
    }
  );

  chunks.clear();

  doorObjects.forEach(
    object=>{
      object.removeFromParent();
    }
  );

  doorObjects.clear();

  villagers.forEach(
    villager=>{
      villager.sprite.removeFromParent();
    }
  );

  villagers=[];

  localStorage.removeItem(
    SAVE_KEY
  );

  spawnPlayer();

  lastChunkX=999999;
  lastChunkZ=999999;

  updateChunks();

  saveWorld();

}

/* ============================================================
   SPAWN
   ============================================================ */

function spawnPlayer(){

  let sx=0;
  let sz=0;

  for(let r=0;r<50;r++){

    const h=
      terrainHeight(
        sx,
        sz
      );

    if(h>SEA_LEVEL+1){
      break;
    }

    sx =
      Math.floor(
        Math.cos(r*1.7)*r
      );

    sz =
      Math.floor(
        Math.sin(r*1.7)*r
      );

  }

  player.x=sx+.5;

  player.z=sz+.5;

  player.y=
    terrainHeight(
      sx,
      sz
    )+1.05;

  player.velocityY=0;

  player.onGround=true;

  yaw=0;
  pitch=0;

}

/* ============================================================
   VILLAGER UPDATE
   ============================================================ */

function updateVillagers(dt){

  villagers.forEach(v=>{

    const spec=v.spec;

    spec.timer-=dt;

    if(spec.timer<=0){

      spec.timer=
        2+
        Math.random()*4;

      const angle=
        Math.random()*
        Math.PI*2;

      const distance=
        1+
        Math.random()*5;

      spec.targetX=
        spec.homeX+
        Math.cos(angle)*distance;

      spec.targetZ=
        spec.homeZ+
        Math.sin(angle)*distance;

    }

    const dx=
      spec.targetX-spec.x;

    const dz=
      spec.targetZ-spec.z;

    const dist=
      Math.hypot(dx,dz);

    if(dist>.15){

      const speed=
        .65*dt;

      spec.x +=
        dx/dist*speed;

      spec.z +=
        dz/dist*speed;

      const h=
        terrainHeight(
          Math.floor(spec.x),
          Math.floor(spec.z)
        );

      if(h>SEA_LEVEL){

        spec.y=h+1;

      }

    }

    v.sprite.position.set(
      spec.x+.5,
      spec.y+.8,
      spec.z+.5
    );

  });

}

  if(

    movePlayer(dt);

    updateCamera();

    updateChunks();

    updateBreaking(dt);

    updateDoors(dt);

    updateVillagers(dt);

    /* water animation */

    if(textures.water){

        dt*.008;

      textures.water.offset.y +=
        dt*.003;

    }

  }

  renderer.render(
    scene,
    camera
  );

}
