<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>RishantCraft</title>

<link rel="icon" type="image/png" href="logo.png">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87c9ff;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* =========================
   HOME
========================= */

#home{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            rgba(0,0,0,.35),
            rgba(0,0,0,.78)
        ),
        radial-gradient(
            circle at center,
            #3c8750,
            #08130b 75%
        );
}

.homeBox{
    width:min(92%,430px);
    padding:30px 24px;
    text-align:center;

    border-radius:25px;

    background:rgba(8,18,11,.82);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 25px 80px rgba(0,0,0,.65);

    backdrop-filter:blur(15px);
}

.homeLogo{
    width:105px;
    height:105px;
    object-fit:cover;

    border-radius:22px;

    margin-bottom:15px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.5);
}

.gameTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:1px;
}

.gameTitle span{
    color:#63e56b;
}

.subtitle{
    color:#b5c5b9;
    font-size:14px;
    margin-top:5px;
    margin-bottom:28px;
}

.homeButtons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menuBtn{
    width:100%;
    border:0;
    border-radius:14px;
    padding:15px;

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #35a956,
            #17682e
        );

    box-shadow:
        0 8px 20px rgba(0,0,0,.3);
}

.menuBtn:active{
    transform:scale(.98);
}

.menuBtn.secondary{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);
}

.controlsText{
    margin-top:22px;

    color:#91a094;

    font-size:11px;
    line-height:1.7;
}

/* =========================
   GAME UI
========================= */

#gameUI{
    display:none;

    position:fixed;
    inset:0;

    z-index:20;

    pointer-events:none;
}

#topBar{
    position:absolute;

    top:12px;
    left:12px;
    right:12px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logoMini{
    padding:9px 13px;

    border-radius:12px;

    background:rgba(0,0,0,.42);

    backdrop-filter:blur(8px);

    font-size:14px;
    font-weight:bold;
}

.logoMini span{
    color:#69e66f;
}

#stats{
    padding:8px 12px;

    border-radius:12px;

    background:rgba(0,0,0,.42);

    font-size:12px;
}

#pauseBtn{
    pointer-events:auto;

    position:absolute;

    top:65px;
    right:12px;

    width:44px;
    height:44px;

    border:0;
    border-radius:13px;

    color:white;
    background:rgba(0,0,0,.5);

    font-size:19px;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
    position:absolute;

    left:50%;
    top:50%;

    width:20px;
    height:20px;

    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";

    position:absolute;

    background:white;

    box-shadow:
        0 0 4px black;
}

#crosshair:before{
    width:2px;
    height:20px;

    left:9px;
    top:0;
}

#crosshair:after{
    width:20px;
    height:2px;

    left:0;
    top:9px;
}

/* =========================
   TOAST
========================= */

#toast{
    position:absolute;

    left:50%;
    top:82px;

    transform:
        translateX(-50%)
        translateY(-15px);

    opacity:0;

    padding:9px 15px;

    border-radius:20px;

    background:rgba(0,0,0,.75);

    font-size:12px;

    transition:.25s;
}

#toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   HINT
========================= */

#hint{
    position:absolute;

    left:50%;
    bottom:100px;

    transform:translateX(-50%);

    padding:7px 12px;

    border-radius:20px;

    background:rgba(0,0,0,.45);

    color:#e4ebe5;

    font-size:11px;

    white-space:nowrap;
}

/* =========================
   HOTBAR
========================= */

#hotbar{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    display:flex;
    gap:5px;

    padding:7px;

    border-radius:13px;

    background:rgba(0,0,0,.5);

    backdrop-filter:blur(8px);
}

.slot{
    position:relative;

    width:46px;
    height:46px;

    overflow:hidden;

    border-radius:8px;

    border:2px solid rgba(255,255,255,.25);

    background:#202720;

    cursor:pointer;

    pointer-events:auto;

    transition:.12s;
}

.slot.selected{
    border-color:white;

    box-shadow:
        0 0 14px rgba(255,255,255,.7);

    transform:translateY(-4px);
}

.slot img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    image-rendering:auto;
}

.slotNumber{
    position:absolute;

    top:2px;
    left:4px;

    font-size:9px;

    color:white;

    text-shadow:
        0 1px 3px black;
}

/* =========================
   PAUSE
========================= */

#pauseMenu{
    display:none;

    position:fixed;
    inset:0;

    z-index:200;

    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(8px);
}

.pauseBox{
    width:min(90%,380px);

    padding:28px;

    border-radius:22px;

    background:#0b160e;

    border:
        1px solid
        rgba(255,255,255,.12);

    text-align:center;
}

.pauseBox h2{
    margin-bottom:22px;
}

.pauseBox .menuBtn{
    margin-top:10px;
}

/* =========================
   MOBILE
========================= */

#mobileControls{
    display:none;

    position:absolute;
    inset:0;

    pointer-events:none;
}

#joystick{
    position:absolute;

    left:20px;
    bottom:25px;

    width:115px;
    height:115px;

    border-radius:50%;

    background:rgba(255,255,255,.09);

    border:
        2px solid
        rgba(255,255,255,.15);

    pointer-events:auto;
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:50px;
    height:50px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        rgba(255,255,255,.23);

    border:
        2px solid
        rgba(255,255,255,.3);
}

.mobileActions{
    position:absolute;

    right:18px;
    bottom:25px;

    display:grid;

    grid-template-columns:
        repeat(2,60px);

    gap:9px;

    pointer-events:auto;
}

.mobileBtn{
    width:60px;
    height:60px;

    border:0;

    border-radius:18px;

    color:white;

    background:rgba(0,0,0,.48);

    border:
        1px solid
        rgba(255,255,255,.14);

    font-size:21px;
}

#jumpBtn{
    grid-column:1 / 3;

    width:129px;
}

#lookArea{
    position:absolute;

    right:0;
    top:100px;

    width:55%;
    height:55%;

    pointer-events:auto;
}

@media(max-width:700px){

    #mobileControls{
        display:block;
    }

    #stats{
        display:none;
    }

    #topBar{
        right:65px;
    }

    .gameTitle{
        font-size:34px;
    }

    .slot{
        width:36px;
        height:36px;
    }

    #hotbar{
        bottom:10px;
        gap:3px;
        padding:5px;
    }

    #hint{
        bottom:70px;
        font-size:9px;
    }
}

@media(pointer:coarse){

    #mobileControls{
        display:block;
    }
}

</style>
</head>

<body>

<!-- =====================================================
HOME
===================================================== -->

<div id="home">

    <div class="homeBox">

        <img
            src="logo.png"
            class="homeLogo"
            alt="RishantCraft"
        >

        <div class="gameTitle">
            Rishant<span>Craft</span>
        </div>

        <div class="subtitle">
            Build • Explore • Create
        </div>

        <div class="homeButtons">

            <button
                class="menuBtn"
                id="playBtn">
                ▶ Play Game
            </button>

            <button
                class="menuBtn secondary"
                id="newWorldBtn">

            </button>

        </div>

        <div class="controlsText">

            Left Click Break • Right Click Place<br>
            Mobile: Joystick + Touch Controls

    </div>

</div>


<!-- =====================================================
GAME UI
===================================================== -->

<div id="gameUI">

    <div id="topBar">

        <div class="logoMini">
            Rishant<span>Craft</span>
        </div>

        <div id="stats">
            X: 0 | Y: 0 | Z: 0
        </div>

    </div>


    <button id="pauseBtn">
        Ⅱ
    </button>


    <div id="crosshair"></div>

    <div id="hint">
        WASD • SPACE • Mouse • Left Click Break • Right Click Place
    </div>

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
PAUSE MENU
===================================================== -->

<div id="pauseMenu">

    <div class="pauseBox">

        <h2>
            Game Paused
        </h2>

        <button
            class="menuBtn"
            id="resumeBtn">
            ▶ Resume
        </button>

        <button
            class="menuBtn secondary"
            id="saveBtn">
            💾 Save World
        </button>

        <button
            class="menuBtn secondary"
            id="resetBtn">
            🔄 Reset World
        </button>

        <button
            class="menuBtn secondary"
            id="mainMenuBtn">
            🏠 Main Menu
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
AUDIO
===================================================== */

/*
IMPORTANT:
All audio files are in SAME folder as index.html
*/

const walkSound =
    new Audio("walk.mp3");

const breakSound =
    new Audio("break.mp3");

const homeMusic =
    new Audio("back.mp3");


walkSound.loop = true;
walkSound.volume = 0.45;

breakSound.loop = false;
breakSound.volume = 0.8;

homeMusic.loop = true;
homeMusic.volume = 0.3;


/* preload */

walkSound.preload = "auto";
breakSound.preload = "auto";
homeMusic.preload = "auto";


function startHomeMusic(){

    if(gameRunning) return;

    homeMusic.play()
    .catch(error=>{
        console.log(
            "Home music waiting for user interaction"
        );
    });

}


function stopHomeMusic(){

    homeMusic.pause();

    try{
        homeMusic.currentTime = 0;
    }catch(e){}

}


function startWalkSound(){

    if(
        !gameRunning ||
        gamePaused
    ){
        return;
    }

    if(walkSound.paused){

        walkSound.play()
        .catch(error=>{
            console.log(
                "Walk sound blocked:",
                error
            );
        });

    }

}


function stopWalkSound(){

    walkSound.pause();

    try{
        walkSound.currentTime = 0;
    }catch(e){}

}


function playBreakSound(){

    breakSound.currentTime = 0;

    breakSound.play()
    .catch(error=>{
        console.log(
            "Break sound blocked:",
            error
        );
    });

}


/*
Unlock audio after a real user click.
*/

function unlockAudio(){

    const sounds = [
        walkSound,
        breakSound,
        homeMusic
    ];

    sounds.forEach(sound=>{

        const oldVolume =
            sound.volume;

        sound.volume = 0;

        sound.play()
        .then(()=>{

            sound.pause();

            sound.currentTime = 0;

            sound.volume =
                oldVolume;

        })
        .catch(()=>{

            sound.volume =
                oldVolume;

        });

    });

}


/* =====================================================
THREE
===================================================== */

const textureLoader =
    new THREE.TextureLoader();


function loadTexture(path){

    const texture =
        textureLoader.load(

            path,

            function(){

                console.log(
                    "Texture loaded:",
                    path
                );

            },

            undefined,

            function(){

                console.error(
                    "TEXTURE NOT FOUND:",
                    path
                );

            }

        );


    /*
    Important for photographic
    non-16x16 textures.
    */

    texture.wrapS =
        THREE.ClampToEdgeWrapping;

    texture.wrapT =
        THREE.ClampToEdgeWrapping;

    texture.magFilter =
        THREE.LinearFilter;

    texture.minFilter =
        THREE.LinearFilter;

    texture.generateMipmaps =
        false;

    texture.colorSpace =
        THREE.SRGBColorSpace;


    return texture;

}


/* =====================================================
TEXTURES
===================================================== */

const textures = {

    grass:
        loadTexture(
            "tileable_grass_00.png"
        ),

    dirt:
        loadTexture(
            "dirt1.png"
        ),

    stone:
        loadTexture(
            "handpaintedwall2.png"
        ),

    sand:
        loadTexture(
            "Sand2_S.jpg"
        ),

    wood:
        loadTexture(
            "wood1.jpg"
        ),

    leaves:
        loadTexture(
            "LongLeaves_S.jpg"
        ),

    glass:
        loadTexture(
            "Transparent.png"
        ),

    brick:
        loadTexture(
            "bricksx64.png"
        )

};


/* =====================================================
GAME VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let ambientLight;
let sunLight;

let clock;

let gameRunning = false;
let gamePaused = false;

let world = {};
let meshes = {};

const WORLD_SIZE = 40;
const WORLD_HALF = 20;
const WORLD_HEIGHT = 18;

const cubeGeometry =
    new THREE.BoxGeometry(1,1,1);


/* =====================================================
BLOCKS
===================================================== */

const blocks = {

    grass:{
        name:"Grass",
        texture:textures.grass
    },

    dirt:{
        name:"Dirt",
        texture:textures.dirt
    },

    stone:{
        name:"Stone",
        texture:textures.stone
    },

    sand:{
        name:"Sand",
        texture:textures.sand
    },

    wood:{
        name:"Wood",
        texture:textures.wood
    },

    leaves:{
        name:"Leaves",
        texture:textures.leaves
    },

    glass:{
        name:"Glass",
        texture:textures.glass,
        transparent:true
    },

    brick:{
        name:"Brick",
        texture:textures.brick
    },

    glow:{
        name:"Brick",
        texture:textures.brick
    }

};


const hotbarTypes = [

    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "glass",
    "brick",
    "glow"

];


let selectedBlock = 0;


/* =====================================================
MATERIALS
===================================================== */

const materialCache = {};


function createMaterial(type){

    if(materialCache[type]){

        return materialCache[type];

    }


    const data =
        blocks[type];


    const material =
        new THREE.MeshLambertMaterial({

            map:data.texture,

            transparent:
                !!data.transparent,

            opacity:
                data.transparent
                ? .65
                : 1,

            depthWrite:
                data.transparent
                ? false
                : true,

            side:
                THREE.FrontSide

        });


    materialCache[type] =
        material;


    return material;

}


/* =====================================================
WORLD
===================================================== */

function key(x,y,z){

    return (
        x + "," +
        y + "," +
        z
    );

}


function setBlock(
    x,
    y,
    z,
    type
){

    world[
        key(x,y,z)
    ] = type;

}


function getBlock(
    x,
    y,
    z
){

    return world[
        key(x,y,z)
    ];

}


function removeBlockData(
    x,
    y,
    z
){

    delete world[
        key(x,y,z)
    ];

}


/* =====================================================
TERRAIN
===================================================== */

function noise(x,z){

    return Math.floor(

        Math.sin(x*.23)*2.2 +

        Math.sin(z*.19)*1.8 +

        Math.sin((x+z)*.11)*1.5 +

        Math.sin(x*.51+z*.37)*.5

    );

}


function generateWorld(){

    world = {};


    for(
        let x=-WORLD_HALF;
        x<WORLD_HALF;
        x++
    ){

        for(
            let z=-WORLD_HALF;
            z<WORLD_HALF;
            z++
        ){

            let height =
                7 + noise(x,z);


            height =
                Math.max(
                    3,
                    Math.min(
                        12,
                        height
                    )
                );


            for(
                let y=0;
                y<=height;
                y++
            ){

                let type =
                    "stone";


                if(y === height){

                    type =
                        height <= 5
                        ? "sand"
                        : "grass";

                }
                else if(
                    y >= height-3
                ){

                    type =
                        "dirt";

                }


                setBlock(
                    x,
                    y,
                    z,
                    type
                );

            }

        }

    }


    createTrees();

}


/* =====================================================
TREES
===================================================== */

function createTrees(){

    for(
        let x=-WORLD_HALF+3;
        x<WORLD_HALF-3;
        x++
    ){

        for(
            let z=-WORLD_HALF+3;
            z<WORLD_HALF-3;
            z++
        ){

            if(
                Math.random() > .035
            ){

                continue;

            }


            let top = -1;


            for(
                let y=WORLD_HEIGHT-1;
                y>=0;
                y--
            ){

                if(
                    getBlock(x,y,z)
                ){

                    top = y;

                    break;

                }

            }


            if(top < 5){

                continue;

            }


            if(
                getBlock(x,top,z)
                !== "grass"
            ){

                continue;

            }


            const trunkHeight =
                3 +
                Math.floor(
                    Math.random()*2
                );


            for(
                let y=1;
                y<=trunkHeight;
                y++
            ){

                setBlock(
                    x,
                    top+y,
                    z,
                    "wood"
                );

            }


            const leafY =
                top + trunkHeight;


            for(
                let lx=-2;
                lx<=2;
                lx++
            ){

                for(
                    let ly=-1;
                    ly<=2;
                    ly++
                ){

                    for(
                        let lz=-2;
                        lz<=2;
                        lz++
                    ){

                        const distance =
                            Math.abs(lx) +
                            Math.abs(lz);


                        if(distance > 3){

                            continue;

                        }


                        if(
                            Math.random() < .15
                        ){

                            continue;

                        }


                        const bx =
                            x + lx;

                        const by =
                            leafY + ly;

                        const bz =
                            z + lz;


                        if(
                            !getBlock(
                                bx,
                                by,
                                bz
                            )
                        ){

                            setBlock(
                                bx,
                                by,
                                bz,
                                "leaves"
                            );

                        }

                    }

                }

            }

        }

    }

}


/* =====================================================
MESHES
===================================================== */

function clearMeshes(){

    Object.values(meshes)
    .forEach(mesh=>{

        scene.remove(mesh);

    });


    meshes = {};

}


function addBlockMesh(
    x,
    y,
    z,
    type
){

    const mesh =
        new THREE.Mesh(

            cubeGeometry,

            createMaterial(type)

        );


    mesh.position.set(
        x+.5,
        y+.5,
        z+.5
    );


    mesh.userData = {

        x:x,
        y:y,
        z:z,
        type:type

    };


    scene.add(mesh);


    meshes[
        key(x,y,z)
    ] = mesh;

}


function buildWorld(){

    clearMeshes();


    for(
        const k in world
    ){

        const p =
            k.split(",");


        const x =
            Number(p[0]);

        const y =
            Number(p[1]);

        const z =
            Number(p[2]);


        addBlockMesh(
            x,
            y,
            z,
            world[k]
        );

    }

}


function addBlock(
    x,
    y,
    z,
    type
){

    if(
        getBlock(x,y,z)
    ){

        return;

    }


    setBlock(
        x,
        y,
        z,
        type
    );


    addBlockMesh(
        x,
        y,
        z,
        type
    );

}


function removeBlock(
    x,
    y,
    z
){

    const k =
        key(x,y,z);


    const mesh =
        meshes[k];


    if(mesh){

        scene.remove(mesh);

        delete meshes[k];

    }


    removeBlockData(
        x,
        y,
        z
    );

}


/* =====================================================
PLAYER
===================================================== */

const player = {

    x:0,
    y:15,
    z:0,

    vx:0,
    vy:0,
    vz:0,

    height:1.75,
    radius:.28,

    speed:5.5,
    jump:7.5,

    onGround:false

};


/* =====================================================
INPUT
===================================================== */

const keys = {};

let yaw = 0;
let pitch = 0;


document.addEventListener(
    "keydown",
    function(e){

        keys[e.code] = true;


        if(
            e.code === "Space" &&
            player.onGround
        ){

            player.vy =
                player.jump;

        }


        if(
            e.code === "KeyE" &&
            gameRunning
        ){

            togglePause();

        }


        if(
            e.code.startsWith("Digit")
        ){

            const n =
                Number(
                    e.code.replace(
                        "Digit",
                        ""
                    )
                );


            if(
                n>=1 &&
                n<=9
            ){

                selectBlock(
                    n-1
                );

            }

        }

    }
);

/* =====================================================
RAYCAST
===================================================== */

const raycaster =
    new THREE.Raycaster();


function getTarget(){

    camera.updateMatrixWorld();


    raycaster.setFromCamera(

        new THREE.Vector2(0,0),

        camera

    );


    const hits =
        raycaster.intersectObjects(
            Object.values(meshes),
            false
        );


    if(!hits.length){

        return null;

    }


    const hit =
        hits[0];


    if(
        hit.distance > 7
    ){

        return null;

    }


    return hit;

}


/* =====================================================
BREAK
===================================================== */

function breakTarget(){

    const hit =
        getTarget();


    if(!hit){

        return;

    }


    const data =
        hit.object.userData;


    if(data.y <= 0){

        return;

    }


    playBreakSound();


    removeBlock(
        data.x,
        data.y,
        data.z
    );


    showToast(
        "⛏ " +
        blocks[data.type].name +
        " broken"
    );

}


/* =====================================================
PLACE
===================================================== */

function placeTarget(){

    const hit =
        getTarget();


    if(
        !hit ||
        !hit.face
    ){

        return;

    }


    const data =
        hit.object.userData;


    const normal =
        hit.face.normal;


    const x =
        data.x +
        Math.round(normal.x);


    const y =
        data.y +
        Math.round(normal.y);


    const z =
        data.z +
        Math.round(normal.z);


    /*
    Don't place inside player
    */

    if(

        x >=
        Math.floor(
            player.x-player.radius
        )

        &&

        x <=
        Math.floor(
            player.x+player.radius
        )

        &&

        z >=
        Math.floor(
            player.z-player.radius
        )

        &&

        z <=
        Math.floor(
            player.z+player.radius
        )

        &&

        y >=
        Math.floor(player.y)

        &&

        y <=
        Math.floor(
            player.y+
            player.height
        )

    ){

        return;

    }


    addBlock(
        x,
        y,
        z,
        hotbarTypes[
            selectedBlock
        ]
    );


    showToast(
        "▣ " +
        blocks[
            hotbarTypes[selectedBlock]
        ].name +
        " placed"
    );

}


/* =====================================================
COLLISION
===================================================== */

function isSolid(
    x,
    y,
    z
){

    return !!getBlock(
        x,y,z
    );

}


function collisionAt(
    px,
    py,
    pz
){

    const minX =
        Math.floor(
            px-player.radius
        );

    const maxX =
        Math.floor(
            px+player.radius
        );

    const minY =
        Math.floor(py);

    const maxY =
        Math.floor(
            py+player.height
        );

    const minZ =
        Math.floor(
            pz-player.radius
        );

    const maxZ =
        Math.floor(
            pz+player.radius
        );


    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(
                    isSolid(x,y,z)
                ){

                    return true;

                }

            }

        }

    }


    return false;

}


/* =====================================================
MOBILE JOYSTICK
===================================================== */

let joyX = 0;
let joyY = 0;

let joystickActive =
    false;


const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


function updateJoystick(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();


    const cx =
        rect.left+
        rect.width/2;


    const cy =
        rect.top+
        rect.height/2;


    let dx =
        clientX-cx;


    let dy =
        clientY-cy;


    const max = 42;


    const len =
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    if(len > max){

        dx =
            dx/len*max;

        dy =
            dy/len*max;

    }


    joyX =
        dx/max;


    joyY =
        dy/max;


    stick.style.transform =
        `translate(
            calc(-50% + ${dx}px),
            calc(-50% + ${dy}px)
        )`;

}


joystick.addEventListener(
    "touchstart",
    function(e){

        joystickActive = true;

        const t =
            e.touches[0];


        updateJoystick(
            t.clientX,
            t.clientY
        );


        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    function(e){

        if(!joystickActive){

            return;

        }


        const t =
            e.touches[0];


        updateJoystick(
            t.clientX,
            t.clientY
        );


        e.preventDefault();

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    function(){

        joystickActive = false;

        joyX = 0;
        joyY = 0;


        stick.style.transform =
            "translate(-50%,-50%)";

    }
);

/* =====================================================
PLAYER UPDATE
===================================================== */

function updatePlayer(dt){

    if(gamePaused){

        stopWalkSound();

        return;

    }


    let forward = 0;
    let strafe = 0;


    if(keys["KeyW"]){

        forward += 1;

    }


    if(keys["KeyS"]){

        forward -= 1;

    }


    if(keys["KeyD"]){

        strafe += 1;

    }


    if(keys["KeyA"]){

        strafe -= 1;

    }


    /* mobile */

    forward += -joyY;

    strafe += joyX;


    const inputLength =
        Math.sqrt(
            forward*forward+
            strafe*strafe
        );


    if(inputLength > 1){

        forward /=
            inputLength;

        strafe /=
            inputLength;

    }


    const sin =
        Math.sin(yaw);


    const cos =
        Math.cos(yaw);


    let moveX =
        strafe*cos+
        forward*sin;


    let moveZ =
        strafe*-sin+
        forward*cos;


    const moving =
        Math.abs(moveX)>.05 ||
        Math.abs(moveZ)>.05;


    const speed =
        (
            keys["ShiftLeft"] ||
            keys["ShiftRight"]
        )
        ?
        player.speed*1.35
        :
        player.speed;


    if(moving){

        player.vx =
            moveX*speed;

        player.vz =
            moveZ*speed;

    }
    else{

        player.vx *= .75;

        player.vz *= .75;

    }


    /* gravity */

    player.vy -=
        20*dt;


    /* X */

    const nx =
        player.x+
        player.vx*dt;


    if(
        !collisionAt(
            nx,
            player.y,
            player.z
        )
    ){

        player.x = nx;

    }
    else{

        player.vx = 0;

    }


    /* Z */

    const nz =
        player.z+
        player.vz*dt;


    if(
        !collisionAt(
            player.x,
            player.y,
            nz
        )
    ){

        player.z = nz;

    }
    else{

        player.vz = 0;

    }


    /* Y */

    const ny =
        player.y+
        player.vy*dt;


    if(
        !collisionAt(
            player.x,
            ny,
            player.z
        )
    ){

        player.y = ny;

        player.onGround =
            false;

    }
    else{

        if(player.vy < 0){

            player.onGround =
                true;

            player.y =
                Math.floor(
                    player.y
                ) + .001;

        }


        player.vy = 0;

    }


    /* WALK SOUND */

    if(
        moving &&
        player.onGround &&
        gameRunning &&
        !gamePaused
    ){

        startWalkSound();

    }
    else{

        stopWalkSound();

    }


    /* FALL RESET */

    if(
        player.y < -20
    ){

        player.x = 0;
        player.y = 15;
        player.z = 0;

        player.vx = 0;
        player.vy = 0;
        player.vz = 0;

    }

}

HOTBAR

function texturePath(type){

    const paths = {

        grass:
            "tileable_grass_00.png",

        dirt:
            "dirt1.png",

        stone:
            "handpaintedwall2.png",

        sand:
            "Sand2_S.jpg",

        wood:
            "wood1.jpg",

        leaves:
            "LongLeaves_S.jpg",

        glass:
            "Transparent.png",

        brick:
            "bricksx64.png",

        glow:
            "bricksx64.png"

    };


    return paths[type];

}


function createHotbar(){

    const bar =
        document.getElementById(
            "hotbar"
        );


    bar.innerHTML = "";


    hotbarTypes.forEach(
        function(type,index){

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot";


            if(
                index === selectedBlock
            ){

                slot.classList.add(
                    "selected"
                );

            }


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                texturePath(type);


            img.onerror =
                function(){

                    console.error(
                        "HOTBAR IMAGE NOT FOUND:",
                        img.src
                    );

                    img.style.display =
                        "none";

                };


            const number =
                document.createElement(
                    "div"
                );


            number.className =
                "slotNumber";


            number.textContent =
                index+1;


            slot.appendChild(img);

            slot.appendChild(number);


            slot.addEventListener(
                "click",
                function(){

                    selectBlock(index);

                }
            );


            bar.appendChild(slot);

        }
    );

}


function selectBlock(index){

    selectedBlock =
        index;


    createHotbar();


    showToast(
        blocks[
            hotbarTypes[index]
        ].name
    );

}

        if(

);


/* =====================================================
DAY NIGHT
===================================================== */

/*
Start at daytime.
*/

let worldTime =
    Math.PI/2;


function updateDayNight(dt){

    /*
    Slow day/night cycle
    */

    worldTime +=
        dt*.008;


    const cycle =
        worldTime;


    const sunX =
        Math.cos(cycle)*35;


    const sunY =
        Math.sin(cycle)*35;


    sunLight.position.set(
        sunX,
        Math.max(5,sunY),
        10
    );


    const daylight =
        Math.max(
            .25,
            Math.sin(cycle)*.5+.5
        );


    ambientLight.intensity =
        .28+
        daylight*.42;


    sunLight.intensity =
        .4+
        daylight*.9;


    /*
    Bright daytime sky
    */

    const r =
        .35+
        daylight*.35;


    const g =
        .55+
        daylight*.35;


    const b =
        .75+
        daylight*.25;


    renderer.setClearColor(
        new THREE.Color(
            r,g,b
        )
    );

}

            JSON.stringify({

        );


    }
    catch(e){

        );

    }

}


/* =====================================================
LOAD
===================================================== */

function loadWorld(){

    const saved =
        localStorage.getItem(
            "rishantcraft_world"
        );


    if(saved){

        try{

            world =
                JSON.parse(saved);

        }
        catch(e){

            generateWorld();

        }

    }
    else{

        generateWorld();

    }


    const savedPlayer =
        localStorage.getItem(
            "rishantcraft_player"
        );


    if(savedPlayer){

        try{

            const p =
                JSON.parse(
                    savedPlayer
                );


            player.x =
                p.x;

            player.y =
                p.y;

            player.z =
                p.z;


            yaw =
                p.yaw || 0;

            pitch =
                p.pitch || 0;


            if(
                typeof p.worldTime
                === "number"
            ){

                worldTime =
                    p.worldTime;

            }

        }
        catch(e){}

    }

}

/* =====================================================
INIT
===================================================== */

function init(){

    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            .05,

            300

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputColorSpace =
        THREE.SRGBColorSpace;


    renderer.setClearColor(
        0x87c9ff
    );


    document.body.appendChild(
        renderer.domElement
    );


    /* LIGHT */

    ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            .7
        );


    scene.add(
        ambientLight
    );


    sunLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );


    sunLight.position.set(
        30,
        35,
        10
    );


    scene.add(
        sunLight
    );


    clock =
        new THREE.Clock();


    window.addEventListener(
        "resize",
        onResize
    );


    animate();

}


/* =====================================================
RESIZE
===================================================== */

function onResize(){

    if(
        !camera ||
        !renderer
    ){

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

    ).textContent =

        " | Y: " +
        player.y.toFixed(1) +

        " | Z: " +
        player.z.toFixed(1);

}


/* =====================================================
GAME LOOP
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!scene){

        return;

    }


    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );


    if(
        gameRunning &&
        !gamePaused
    ){

        updatePlayer(dt);

        updateCamera();

        updateDayNight(dt);

        updateStats();

    }


    renderer.render(
        scene,
        camera
    );

}
