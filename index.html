<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>RishantCraft</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#07100a;
    color:white;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    display:block;
    width:100%;
    height:100%;
}

/* =========================
   HOME SCREEN
========================= */

#home{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,
        rgba(34,100,54,.35),
        rgba(2,7,4,.96) 70%);
}

.homeBox{
    width:min(92%,430px);
    padding:30px 25px;
    text-align:center;
    border:1px solid rgba(255,255,255,.16);
    border-radius:25px;
    background:rgba(7,18,11,.82);
    backdrop-filter:blur(15px);
    box-shadow:0 25px 80px rgba(0,0,0,.65);
}

.homeLogo{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:22px;
    margin-bottom:15px;
    box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.gameTitle{
    font-size:42px;
    font-weight:900;
    letter-spacing:1px;
    margin-bottom:5px;
}

.gameTitle span{
    color:#69e66f;
}

.subtitle{
    color:#a9b9ad;
    margin-bottom:28px;
    font-size:14px;
}

.homeButtons{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.menuBtn{
    border:none;
    border-radius:14px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#2f9d4d,#187133);
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.menuBtn:hover{
    filter:brightness(1.12);
}

.menuBtn.secondary{
    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.12);
}

.controlsText{
    margin-top:22px;
    font-size:11px;
    color:#849188;
    line-height:1.7;
}

/* =========================
   GAME UI
========================= */

#gameUI{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
}

#topBar{
    position:absolute;
    top:12px;
    left:12px;
    right:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logoMini{
    padding:9px 13px;
    border-radius:12px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(8px);
    font-size:14px;
    font-weight:bold;
}

.logoMini span{
    color:#69e66f;
}

#stats{
    padding:8px 12px;
    border-radius:12px;
    background:rgba(0,0,0,.42);
    backdrop-filter:blur(8px);
    font-size:12px;
    color:#d9e6dc;
}

#pauseBtn{
    pointer-events:auto;
    position:absolute;
    top:65px;
    right:12px;
    width:44px;
    height:44px;
    border:none;
    border-radius:13px;
    background:rgba(0,0,0,.48);
    color:white;
    font-size:20px;
}

/* crosshair */

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    transform:translate(-50%,-50%);
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 4px black;
}

#crosshair:before{
    width:2px;
    height:20px;
    left:9px;
    top:0;
}

#crosshair:after{
    height:2px;
    width:20px;
    left:0;
    top:9px;
}

/* hint */

#hint{
    position:absolute;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:rgba(0,0,0,.45);
    padding:7px 12px;
    border-radius:20px;
    color:#dce7de;
    font-size:11px;
    white-space:nowrap;
}

/* toast */

#toast{
    position:absolute;
    left:50%;
    top:82px;
    transform:translateX(-50%) translateY(-15px);
    opacity:0;
    background:rgba(0,0,0,.75);
    padding:9px 15px;
    border-radius:20px;
    font-size:12px;
    transition:.25s;
}

#toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* =========================
   HOTBAR
========================= */

#hotbar{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:7px;
    border-radius:13px;
    background:rgba(0,0,0,.48);
    backdrop-filter:blur(8px);
}

.slot{
    position:relative;
    width:46px;
    height:46px;
    border-radius:8px;
    border:2px solid rgba(255,255,255,.2);
    overflow:hidden;
    background:#202720;
    cursor:pointer;
    pointer-events:auto;
}

.slot.selected{
    border-color:#fff;
    box-shadow:0 0 12px rgba(255,255,255,.55);
    transform:translateY(-4px);
}

.slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    image-rendering:auto;
}

.slotNumber{
    position:absolute;
    left:3px;
    top:2px;
    font-size:9px;
    color:white;
    text-shadow:0 1px 3px black;
}

/* =========================
   PAUSE
========================= */

#pauseMenu{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:rgba(0,0,0,.68);
    backdrop-filter:blur(8px);
    justify-content:center;
    align-items:center;
}

.pauseBox{
    width:min(90%,380px);
    padding:28px;
    border-radius:22px;
    background:#0b160e;
    border:1px solid rgba(255,255,255,.12);
    text-align:center;
}

.pauseBox h2{
    margin-bottom:22px;
}

.pauseBox .menuBtn{
    width:100%;
    margin-top:10px;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls{
    display:none;
    position:absolute;
    inset:0;
    pointer-events:none;
}

#joystick{
    position:absolute;
    left:20px;
    bottom:25px;
    width:115px;
    height:115px;
    border-radius:50%;
    background:rgba(255,255,255,.09);
    border:2px solid rgba(255,255,255,.15);
    pointer-events:auto;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:50px;
    height:50px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:rgba(255,255,255,.23);
    border:2px solid rgba(255,255,255,.3);
}

.mobileActions{
    position:absolute;
    right:18px;
    bottom:25px;
    display:grid;
    grid-template-columns:repeat(2,60px);
    gap:9px;
    pointer-events:auto;
}

.mobileBtn{
    width:60px;
    height:60px;
    border:none;
    border-radius:18px;
    color:white;
    background:rgba(0,0,0,.48);
    border:1px solid rgba(255,255,255,.14);
    font-size:22px;
}

#jumpBtn{
    grid-column:1 / 3;
    width:129px;
}

#lookArea{
    position:absolute;
    right:0;
    top:100px;
    width:55%;
    height:55%;
    pointer-events:auto;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    .gameTitle{
        font-size:34px;
    }

    .homeBox{
        padding:25px 20px;
    }

    #hotbar{
        bottom:10px;
        gap:3px;
        padding:5px;
    }

    .slot{
        width:36px;
        height:36px;
    }

    #hint{
        bottom:70px;
        font-size:9px;
    }

    #stats{
        display:none;
    }

    #mobileControls{
        display:block;
    }

    #pauseBtn{
        top:12px;
    }

    #topBar{
        right:65px;
    }

    .logoMini{
        font-size:11px;
    }
}

@media(pointer:coarse){
    #mobileControls{
        display:block;
    }
}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<div id="home">

    <div class="homeBox">

        <img src="logo.png" class="homeLogo" alt="RishantCraft">

        <div class="gameTitle">
            Rishant<span>Craft</span>
        </div>

        <div class="subtitle">
            Build • Explore • Create
        </div>

        <div class="homeButtons">

            <button class="menuBtn" id="playBtn">
                ▶ Play Game
            </button>

            <button class="menuBtn secondary" id="newWorldBtn">
                🌍 New World
            </button>

        </div>

        <div class="controlsText">
            PC: WASD Move • Space Jump • Mouse Look<br>
            Left Click Break • Right Click Place<br>
            Mobile: Joystick + Touch Controls
        </div>

    </div>

</div>

<!-- =========================
     GAME UI
========================= -->

<div id="gameUI">

    <div id="topBar">

        <div class="logoMini">
            Rishant<span>Craft</span>
        </div>

        <div id="stats">
            X: 0 | Y: 0 | Z: 0
        </div>

    </div>

    <button id="pauseBtn">Ⅱ</button>

    <div id="crosshair"></div>

    <div id="toast"></div>

    <div id="hint">
        WASD • SPACE • Mouse • Left Click Break • Right Click Place
    </div>

    <div id="hotbar"></div>

    <!-- MOBILE -->

    <div id="mobileControls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <div class="mobileActions">

            <button class="mobileBtn" id="breakBtn">
                ⛏
            </button>

            <button class="mobileBtn" id="placeBtn">
                ▣
            </button>

            <button class="mobileBtn" id="jumpBtn">
                ↑ Jump
            </button>

        </div>

        <div id="lookArea"></div>

    </div>

</div>

<!-- =========================
     PAUSE MENU
========================= -->

<div id="pauseMenu">

    <div class="pauseBox">

        <h2>Game Paused</h2>

        <button class="menuBtn" id="resumeBtn">
            ▶ Resume
        </button>

        <button class="menuBtn secondary" id="saveBtn">
            💾 Save World
        </button>

        <button class="menuBtn secondary" id="resetBtn">
            🔄 Reset World
        </button>

        <button class="menuBtn secondary" id="mainMenuBtn">
            🏠 Main Menu
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   RISHANTCRAFT
   COMPLETE SINGLE FILE VOXEL GAME
========================================================= */


/* =========================================================
   AUDIO
========================================================= */

const walkSound = new Audio("sounds/walk.mp3");
const breakSound = new Audio("sounds/break.mp3");
const homeMusic = new Audio("sounds/back.mp3");

walkSound.loop = true;
walkSound.volume = 0.32;

breakSound.volume = 0.65;

homeMusic.loop = true;
homeMusic.volume = 0.28;

let audioStarted = false;

function startHomeMusic(){

    homeMusic.currentTime = 0;

    homeMusic.play().catch(()=>{});

}

function stopHomeMusic(){

    homeMusic.pause();
    homeMusic.currentTime = 0;

}

function startWalkSound(){

    if(gamePaused) return;

    walkSound.play().catch(()=>{});

}

function stopWalkSound(){

    walkSound.pause();

    try{
        walkSound.currentTime = 0;
    }catch(e){}

}

function playBreakSound(){

    try{

        breakSound.currentTime = 0;

        breakSound.play().catch(()=>{});

    }catch(e){}

}


/* =========================================================
   TEXTURES
========================================================= */

const textureLoader = new THREE.TextureLoader();

function loadTexture(path){

    const texture = textureLoader.load(
        path,
        undefined,
        undefined,
        function(){
            console.warn("Texture failed:",path);
        }
    );

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    texture.magFilter = THREE.LinearFilter;
    texture.minFilter = THREE.LinearMipmapLinearFilter;

    texture.colorSpace = THREE.SRGBColorSpace;

    return texture;
}


/* Load user textures */

const textures = {

    grass:
        loadTexture("textures/tileable_grass_00.png"),

    dirt:
        loadTexture("textures/dirt1.png"),

    stone:
        loadTexture("textures/handpaintedwall2.png"),

    sand:
        loadTexture("textures/Sand2_S.jpg"),

    wood:
        loadTexture("textures/wood1.jpg"),

    leaves:
        loadTexture("textures/LongLeaves_S.jpg"),

    glass:
        loadTexture("textures/Transparent.png"),

    brick:
        loadTexture("textures/bricksx64.png")

};


/* =========================================================
   SCENE
========================================================= */

let scene;
let camera;
let renderer;

let ambientLight;
let sunLight;

let clock;

let gameRunning = false;
let gamePaused = false;

let world = {};
let meshes = {};

const WORLD_SIZE = 40;
const WORLD_HALF = WORLD_SIZE / 2;
const WORLD_HEIGHT = 18;
const WATER_LEVEL = 4;

const blockSize = 1;


/* =========================================================
   BLOCKS
========================================================= */

const blocks = {

    grass:{
        name:"Grass",
        texture:textures.grass
    },

    dirt:{
        name:"Dirt",
        texture:textures.dirt
    },

    stone:{
        name:"Stone",
        texture:textures.stone
    },

    sand:{
        name:"Sand",
        texture:textures.sand
    },

    wood:{
        name:"Wood",
        texture:textures.wood
    },

    leaves:{
        name:"Leaves",
        texture:textures.leaves
    },

    glass:{
        name:"Glass",
        texture:textures.glass,
        transparent:true
    },

    brick:{
        name:"Brick",
        texture:textures.brick
    },

    glow:{
        name:"Glow",
        texture:textures.brick
    }

};


const hotbarTypes = [
    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "glass",
    "brick",
    "glow"
];

let selectedBlock = 0;


/* =========================================================
   MATERIALS
========================================================= */

const materialCache = {};

function createMaterial(type){

    if(materialCache[type]){
        return materialCache[type];
    }

    const data = blocks[type];

    const material =
        new THREE.MeshLambertMaterial({

            map:data.texture,

            transparent:!!data.transparent,

            opacity:data.transparent ? .65 : 1,

            depthWrite:data.transparent ? false : true,

            side:THREE.FrontSide

        });

    materialCache[type] = material;

    return material;
}


/* =========================================================
   BLOCK GEOMETRY
========================================================= */

const cubeGeometry =
    new THREE.BoxGeometry(1,1,1);


/* =========================================================
   WORLD KEY
========================================================= */

function key(x,y,z){

    return `${x},${y},${z}`;

}


/* =========================================================
   WORLD FUNCTIONS
========================================================= */

function setBlock(x,y,z,type){

    world[key(x,y,z)] = type;

}


function getBlock(x,y,z){

    return world[key(x,y,z)];

}


function removeBlockData(x,y,z){

    delete world[key(x,y,z)];

}


/* =========================================================
   SIMPLE TERRAIN NOISE
========================================================= */

function noise(x,z){

    const n =
        Math.sin(x * 0.23) * 2.2 +
        Math.sin(z * 0.19) * 1.8 +
        Math.sin((x+z) * 0.11) * 1.5 +
        Math.sin(x * .51 + z * .37) * .5;

    return Math.floor(n);

}


/* =========================================================
   GENERATE WORLD
========================================================= */

function generateWorld(){

    world = {};

    for(let x=-WORLD_HALF; x<WORLD_HALF; x++){

        for(let z=-WORLD_HALF; z<WORLD_HALF; z++){

            let h =
                6 +
                noise(x,z);

            h = Math.max(3,Math.min(12,h));

            for(let y=0; y<=h; y++){

                let type = "stone";

                if(y === h){

                    type =
                        h <= WATER_LEVEL + 1
                        ? "sand"
                        : "grass";

                }
                else if(y >= h-3){

                    type = "dirt";

                }

                setBlock(x,y,z,type);

            }

        }

    }

    createTrees();

}


/* =========================================================
   TREES
========================================================= */

function createTrees(){

    for(let x=-WORLD_HALF+3; x<WORLD_HALF-3; x++){

        for(let z=-WORLD_HALF+3; z<WORLD_HALF-3; z++){

            if(Math.random() > .035) continue;

            let top = -1;

            for(let y=WORLD_HEIGHT-1; y>=0; y--){

                if(getBlock(x,y,z)){

                    top = y;
                    break;

                }

            }

            if(top < 5) continue;

            if(getBlock(x,top,z) !== "grass") continue;

            /* trunk */

            const trunkHeight =
                3 + Math.floor(Math.random()*2);

            for(let y=1; y<=trunkHeight; y++){

                setBlock(
                    x,
                    top+y,
                    z,
                    "wood"
                );

            }

            /* leaves */

            const leafY = top + trunkHeight;

            for(let lx=-2; lx<=2; lx++){

                for(let ly=-1; ly<=2; ly++){

                    for(let lz=-2; lz<=2; lz++){

                        const distance =
                            Math.abs(lx) +
                            Math.abs(lz);

                        if(distance > 3) continue;

                        if(Math.random() < .15) continue;

                        const bx = x+lx;
                        const by = leafY+ly;
                        const bz = z+lz;

                        if(!getBlock(bx,by,bz)){

                            setBlock(
                                bx,
                                by,
                                bz,
                                "leaves"
                            );

                        }

                    }

                }

            }

        }

    }

}


/* =========================================================
   BUILD WORLD MESH
========================================================= */

function clearMeshes(){

    Object.values(meshes).forEach(mesh=>{

        scene.remove(mesh);

        mesh.geometry.dispose();

    });

    meshes = {};

}


function buildWorld(){

    clearMeshes();

    for(const k in world){

        const parts = k.split(",");

        const x = Number(parts[0]);
        const y = Number(parts[1]);
        const z = Number(parts[2]);

        const type = world[k];

        addBlockMesh(x,y,z,type);

    }

}


function addBlockMesh(x,y,z,type){

    const mesh =
        new THREE.Mesh(
            cubeGeometry,
            createMaterial(type)
        );

    mesh.position.set(
        x+.5,
        y+.5,
        z+.5
    );

    mesh.userData = {
        x,
        y,
        z,
        type
    };

    scene.add(mesh);

    meshes[key(x,y,z)] = mesh;

}


/* =========================================================
   ADD BLOCK
========================================================= */

function addBlock(x,y,z,type){

    if(getBlock(x,y,z)) return;

    setBlock(x,y,z,type);

    addBlockMesh(x,y,z,type);

}


/* =========================================================
   REMOVE BLOCK
========================================================= */

function removeBlock(x,y,z){

    const k = key(x,y,z);

    const mesh = meshes[k];

    if(mesh){

        scene.remove(mesh);

        delete meshes[k];

    }

    removeBlockData(x,y,z);

}


/* =========================================================
   PLAYER
========================================================= */

const player = {

    x:0,
    y:12,
    z:0,

    vx:0,
    vy:0,
    vz:0,

    height:1.75,
    radius:.28,

    speed:5.5,
    jump:7.5,

    onGround:false

};


/* =========================================================
   INPUT
========================================================= */

const keys = {};

let yaw = 0;
let pitch = 0;

document.addEventListener("keydown",e=>{

    keys[e.code] = true;

    if(
        e.code === "Space" &&
        player.onGround
    ){

        player.vy = player.jump;

    }

    if(
        e.code === "KeyE" &&
        gameRunning
    ){

        togglePause();

    }

    if(
        e.code.startsWith("Digit")
    ){

        const n =
            Number(e.code.replace("Digit",""));

        if(n>=1 && n<=9){

            selectBlock(n-1);

        }

    }

});


document.addEventListener("keyup",e=>{

    keys[e.code] = false;

});


/* =========================================================
   MOUSE
========================================================= */

document.addEventListener("click",()=>{

    if(!gameRunning || gamePaused) return;

    if(document.pointerLockElement !== document.body){

        document.body.requestPointerLock?.();

    }

});


document.addEventListener("mousemove",e=>{

    if(
        !gameRunning ||
        gamePaused ||
        document.pointerLockElement !== document.body
    ) return;

    yaw -= e.movementX * .0025;

    pitch -= e.movementY * .0025;

    pitch =
        Math.max(
            -Math.PI/2+.1,
            Math.min(Math.PI/2-.1,pitch)
        );

});


document.addEventListener("mousedown",e=>{

    if(!gameRunning || gamePaused) return;

    if(e.button === 0){

        breakTarget();

    }

    if(e.button === 2){

        placeTarget();

    }

});


document.addEventListener("contextmenu",e=>{
    e.preventDefault();
});


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

let joyX = 0;
let joyY = 0;
let joystickActive = false;

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");


function updateJoystick(clientX,clientY){

    const rect =
        joystick.getBoundingClientRect();

    const cx =
        rect.left + rect.width/2;

    const cy =
        rect.top + rect.height/2;

    let dx = clientX-cx;
    let dy = clientY-cy;

    const max = 42;

    const len =
        Math.sqrt(dx*dx+dy*dy);

    if(len > max){

        dx = dx / len * max;
        dy = dy / len * max;

    }

    joyX = dx/max;
    joyY = dy/max;

    stick.style.transform =
        `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;

}


joystick.addEventListener("touchstart",e=>{

    joystickActive = true;

    const t = e.touches[0];

    updateJoystick(t.clientX,t.clientY);

    e.preventDefault();

},{passive:false});


joystick.addEventListener("touchmove",e=>{

    if(!joystickActive) return;

    const t = e.touches[0];

    updateJoystick(t.clientX,t.clientY);

    e.preventDefault();

},{passive:false});


joystick.addEventListener("touchend",()=>{

    joystickActive = false;

    joyX = 0;
    joyY = 0;

    stick.style.transform =
        "translate(-50%,-50%)";

});


/* =========================================================
   MOBILE LOOK
========================================================= */

let lastTouchX = 0;
let lastTouchY = 0;

const lookArea =
    document.getElementById("lookArea");

lookArea.addEventListener("touchstart",e=>{

    const t = e.touches[0];

    lastTouchX = t.clientX;
    lastTouchY = t.clientY;

},{passive:true});


lookArea.addEventListener("touchmove",e=>{

    if(!gameRunning || gamePaused) return;

    const t = e.touches[0];

    const dx = t.clientX-lastTouchX;
    const dy = t.clientY-lastTouchY;

    lastTouchX = t.clientX;
    lastTouchY = t.clientY;

    yaw -= dx*.006;

    pitch -= dy*.006;

    pitch =
        Math.max(
            -Math.PI/2+.1,
            Math.min(Math.PI/2-.1,pitch)
        );

    e.preventDefault();

},{passive:false});


/* =========================================================
   MOBILE ACTIONS
========================================================= */

document.getElementById("jumpBtn")
.addEventListener("touchstart",e=>{

    if(player.onGround){

        player.vy = player.jump;

    }

    e.preventDefault();

},{passive:false});


document.getElementById("breakBtn")
.addEventListener("touchstart",e=>{

    breakTarget();

    e.preventDefault();

},{passive:false});


document.getElementById("placeBtn")
.addEventListener("touchstart",e=>{

    placeTarget();

    e.preventDefault();

},{passive:false});


/* =========================================================
   TARGET RAYCAST
========================================================= */

const raycaster =
    new THREE.Raycaster();

function getTarget(){

    camera.updateMatrixWorld();

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects =
        Object.values(meshes);

    const hits =
        raycaster.intersectObjects(objects,false);

    if(!hits.length) return null;

    const hit = hits[0];

    if(hit.distance > 7) return null;

    return hit;

}


/* =========================================================
   BREAK
========================================================= */

function breakTarget(){

    const hit = getTarget();

    if(!hit) return;

    const data = hit.object.userData;

    if(
        data.y <= 0
    ) return;

    playBreakSound();

    removeBlock(
        data.x,
        data.y,
        data.z
    );

    showToast(
        "⛏ " + blocks[data.type].name + " broken"
    );

}


/* =========================================================
   PLACE
========================================================= */

function placeTarget(){

    const hit = getTarget();

    if(!hit || !hit.face) return;

    const data = hit.object.userData;

    const normal =
        hit.face.normal;

    const x =
        data.x + Math.round(normal.x);

    const y =
        data.y + Math.round(normal.y);

    const z =
        data.z + Math.round(normal.z);

    /* prevent block inside player */

    if(
        x >= Math.floor(player.x-player.radius) &&
        x <= Math.floor(player.x+player.radius) &&
        z >= Math.floor(player.z-player.radius) &&
        z <= Math.floor(player.z+player.radius) &&
        y >= Math.floor(player.y) &&
        y <= Math.floor(player.y+player.height)
    ){

        return;

    }

    addBlock(
        x,
        y,
        z,
        hotbarTypes[selectedBlock]
    );

    showToast(
        "▣ " +
        blocks[hotbarTypes[selectedBlock]].name +
        " placed"
    );

}


/* =========================================================
   COLLISION
========================================================= */

function isSolid(x,y,z){

    return !!getBlock(x,y,z);

}


function collisionAt(px,py,pz){

    const minX =
        Math.floor(px-player.radius);

    const maxX =
        Math.floor(px+player.radius);

    const minY =
        Math.floor(py);

    const maxY =
        Math.floor(py+player.height);

    const minZ =
        Math.floor(pz-player.radius);

    const maxZ =
        Math.floor(pz+player.radius);

    for(let x=minX;x<=maxX;x++){

        for(let y=minY;y<=maxY;y++){

            for(let z=minZ;z<=maxZ;z++){

                if(isSolid(x,y,z)){

                    return true;

                }

            }

        }

    }

    return false;

}


/* =========================================================
   PLAYER UPDATE
========================================================= */

function updatePlayer(dt){

    if(gamePaused) return;

    let forward = 0;
    let strafe = 0;

    if(keys["KeyW"]) forward += 1;
    if(keys["KeyS"]) forward -= 1;
    if(keys["KeyD"]) strafe += 1;
    if(keys["KeyA"]) strafe -= 1;

    /* mobile */

    forward += -joyY;
    strafe += joyX;

    const inputLength =
        Math.sqrt(
            forward*forward +
            strafe*strafe
        );

    if(inputLength > 1){

        forward /= inputLength;
        strafe /= inputLength;

    }

    /* direction */

    const sin = Math.sin(yaw);
    const cos = Math.cos(yaw);

    let moveX =
        strafe*cos +
        forward*sin;

    let moveZ =
        strafe*-sin +
        forward*cos;

    const moving =
        Math.abs(moveX)>.05 ||
        Math.abs(moveZ)>.05;

    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
        ? player.speed*1.35
        : player.speed;

    if(moving){

        player.vx =
            moveX * speed;

        player.vz =
            moveZ * speed;

    }else{

        player.vx *= .75;
        player.vz *= .75;

    }

    /* gravity */

    player.vy -= 20*dt;

    /* X */

    let nx =
        player.x + player.vx*dt;

    if(!collisionAt(nx,player.y,player.z)){

        player.x = nx;

    }else{

        player.vx = 0;

    }

    /* Z */

    let nz =
        player.z + player.vz*dt;

    if(!collisionAt(player.x,player.y,nz)){

        player.z = nz;

    }else{

        player.vz = 0;

    }

    /* Y */

    let ny =
        player.y + player.vy*dt;

    if(!collisionAt(player.x,ny,player.z)){

        player.y = ny;

        player.onGround = false;

    }else{

        if(player.vy < 0){

            player.onGround = true;

            player.y =
                Math.floor(player.y)+0.001;

        }

        player.vy = 0;

    }

    /* walking sound */

    if(
        moving &&
        player.onGround &&
        gameRunning &&
        !gamePaused
    ){

        startWalkSound();

    }else{

        stopWalkSound();

    }

    /* fall recovery */

    if(player.y < -20){

        player.x = 0;
        player.z = 0;
        player.y = 15;
        player.vy = 0;

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    camera.position.set(
        player.x,
        player.y + player.height*.86,
        player.z
    );

    camera.rotation.order = "YXZ";

    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

}


/* =========================================================
   HOTBAR
========================================================= */

function createHotbar(){

    const bar =
        document.getElementById("hotbar");

    bar.innerHTML = "";

    hotbarTypes.forEach((type,index)=>{

        const slot =
            document.createElement("div");

        slot.className = "slot";

        if(index === selectedBlock){

            slot.classList.add("selected");

        }

        const img =
            document.createElement("img");

        img.src =
            texturePath(type);

        const num =
            document.createElement("div");

        num.className = "slotNumber";

        num.textContent = index+1;

        slot.appendChild(img);
        slot.appendChild(num);

        slot.addEventListener("click",()=>{

            selectBlock(index);

        });

        bar.appendChild(slot);

    });

}


function texturePath(type){

    const paths = {

        grass:
            "textures/tileable_grass_00.png",

        dirt:
            "textures/dirt1.png",

        stone:
            "textures/handpaintedwall2.png",

        sand:
            "textures/Sand2_S.jpg",

        wood:
            "textures/wood1.jpg",

        leaves:
            "textures/LongLeaves_S.jpg",

        glass:
            "textures/Transparent.png",

        brick:
            "textures/bricksx64.png",

        glow:
            "textures/bricksx64.png"

    };

    return paths[type];

}


function selectBlock(index){

    selectedBlock = index;

    createHotbar();

    showToast(
        blocks[hotbarTypes[index]].name
    );

}


/* =========================================================
   MOUSE WHEEL
========================================================= */

document.addEventListener("wheel",e=>{

    if(!gameRunning || gamePaused) return;

    if(e.deltaY > 0){

        selectedBlock++;

    }else{

        selectedBlock--;

    }

    if(selectedBlock < 0){

        selectedBlock =
            hotbarTypes.length-1;

    }

    if(selectedBlock >= hotbarTypes.length){

        selectedBlock = 0;

    }

    createHotbar();

},{passive:true});


/* =========================================================
   DAY / NIGHT
========================================================= */

let worldTime = 0;

function updateDayNight(dt){

    worldTime += dt*.035;

    const cycle =
        worldTime % (Math.PI*2);

    const sunX =
        Math.cos(cycle)*30;

    const sunY =
        Math.sin(cycle)*30;

    sunLight.position.set(
        sunX,
        Math.max(5,sunY),
        10
    );

    const daylight =
        Math.max(
            .15,
            Math.sin(cycle)*.5+.5
        );

    ambientLight.intensity =
        .22 + daylight*.38;

    sunLight.intensity =
        .35 + daylight*.85;

    renderer.setClearColor(
        new THREE.Color(
            0.08*daylight+.02,
            0.15*daylight+.04,
            0.22*daylight+.08
        )
    );

}


/* =========================================================
   SAVE
========================================================= */

function saveWorld(){

    try{

        localStorage.setItem(
            "rishantcraft_world",
            JSON.stringify(world)
        );

        localStorage.setItem(
            "rishantcraft_player",
            JSON.stringify({
                x:player.x,
                y:player.y,
                z:player.z,
                yaw,
                pitch,
                worldTime
            })
        );

        showToast("💾 World saved");

    }catch(e){

        console.error(e);

        showToast("Save failed");

    }

}


/* =========================================================
   LOAD
========================================================= */

function loadWorld(){

    const saved =
        localStorage.getItem(
            "rishantcraft_world"
        );

    if(saved){

        try{

            world =
                JSON.parse(saved);

        }catch(e){

            generateWorld();

        }

    }else{

        generateWorld();

    }

    const savedPlayer =
        localStorage.getItem(
            "rishantcraft_player"
        );

    if(savedPlayer){

        try{

            const p =
                JSON.parse(savedPlayer);

            player.x = p.x;
            player.y = p.y;
            player.z = p.z;

            yaw = p.yaw || 0;
            pitch = p.pitch || 0;

            worldTime =
                p.worldTime || 0;

        }catch(e){}

    }

}


/* =========================================================
   RESET
========================================================= */

function resetWorld(){

    if(
        !confirm(
            "Reset your world? Your saved world will be deleted."
        )
    ){

        return;

    }

    localStorage.removeItem(
        "rishantcraft_world"
    );

    localStorage.removeItem(
        "rishantcraft_player"
    );

    generateWorld();

    buildWorld();

    player.x = 0;
    player.y = 15;
    player.z = 0;

    player.vx = 0;
    player.vy = 0;
    player.vz = 0;

    yaw = 0;
    pitch = 0;

    showToast("🌍 New world created");

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(()=>{

            toast.classList.remove("show");

        },1600);

}


/* =========================================================
   PAUSE
========================================================= */

function togglePause(){

    if(!gameRunning) return;

    if(gamePaused){

        resumeGame();

    }else{

        pauseGame();

    }

}


function pauseGame(){

    gamePaused = true;

    stopWalkSound();

    document.getElementById(
        "pauseMenu"
    ).style.display = "flex";

    if(document.pointerLockElement){

        document.exitPointerLock();

    }

}


function resumeGame(){

    gamePaused = false;

    document.getElementById(
        "pauseMenu"
    ).style.display = "none";

}


/* =========================================================
   START GAME
========================================================= */

function startGame(newWorld=false){

    if(newWorld){

        localStorage.removeItem(
            "rishantcraft_world"
        );

        localStorage.removeItem(
            "rishantcraft_player"
        );

    }

    if(!scene){

        init();

    }

    loadWorld();

    buildWorld();

    gameRunning = true;
    gamePaused = false;

    document.getElementById("home")
        .style.display = "none";

    document.getElementById("gameUI")
        .style.display = "block";

    document.getElementById("pauseMenu")
        .style.display = "none";

    createHotbar();

    stopHomeMusic();

    /* browser audio permission */

    walkSound.load();
    breakSound.load();

}


/* =========================================================
   MAIN MENU
========================================================= */

function mainMenu(){

    gameRunning = false;
    gamePaused = false;

    stopWalkSound();

    stopHomeMusic();

    document.getElementById("pauseMenu")
        .style.display = "none";

    document.getElementById("gameUI")
        .style.display = "none";

    document.getElementById("home")
        .style.display = "flex";

    startHomeMusic();

}


/* =========================================================
   THREE.JS INIT
========================================================= */

function init(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x102018);

    camera =
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth/window.innerHeight,
            .05,
            300
        );

    renderer =
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:"high-performance"
        });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio,2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputColorSpace =
        THREE.SRGBColorSpace;

    renderer.shadowMap.enabled = true;

    document.body.appendChild(
        renderer.domElement
    );

    /* lights */

    ambientLight =
        new THREE.AmbientLight(
            0xffffff,
            .55
        );

    scene.add(ambientLight);

    sunLight =
        new THREE.DirectionalLight(
            0xffffff,
            1.1
        );

    sunLight.position.set(
        30,
        35,
        10
    );

    sunLight.castShadow = true;

    scene.add(sunLight);

    /* clock */

    clock = new THREE.Clock();

    /* resize */

    window.addEventListener(
        "resize",
        onResize
    );

    animate();

}


/* =========================================================
   RESIZE
========================================================= */

function onResize(){

    if(!camera || !renderer) return;

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    document.getElementById(
        "stats"
    ).textContent =
        `X: ${player.x.toFixed(1)} | ` +
        `Y: ${player.y.toFixed(1)} | ` +
        `Z: ${player.z.toFixed(1)}`;

}


/* =========================================================
   GAME LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    if(!scene) return;

    const dt =
        Math.min(
            clock.getDelta(),
            .05
        );

    if(gameRunning && !gamePaused){

        updatePlayer(dt);

        updateCamera();

        updateDayNight(dt);

        updateStats();

    }

    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById("playBtn")
.addEventListener("click",()=>{

    startGame(false);

});


document.getElementById("newWorldBtn")
.addEventListener("click",()=>{

    startGame(true);

});


document.getElementById("pauseBtn")
.addEventListener("click",()=>{

    togglePause();

});


document.getElementById("resumeBtn")
.addEventListener("click",()=>{

    resumeGame();

});


document.getElementById("saveBtn")
.addEventListener("click",()=>{

    saveWorld();

});


document.getElementById("resetBtn")
.addEventListener("click",()=>{

    resetWorld();

});


document.getElementById("mainMenuBtn")
.addEventListener("click",()=>{

    mainMenu();

});


/* =========================================================
   AUTOSAVE
========================================================= */

setInterval(()=>{

    if(gameRunning && !gamePaused){

        saveWorld();

    }

},30000);


/* =========================================================
   START HOME MUSIC
========================================================= */

window.addEventListener("load",()=>{

    /*
      Browser autoplay may block music.
      First click on the Home screen starts it.
    */

});


/* Start music after first user interaction */

document.addEventListener("pointerdown",()=>{

    if(
        !gameRunning &&
        document.getElementById("home")
            .style.display !== "none"
    ){

        startHomeMusic();

    }

},{once:false});


</script>
