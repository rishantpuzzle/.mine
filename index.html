<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>RishantCraft</title>

<link rel="icon" href="logo.png">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
    position:fixed;
    inset:0;
}

#menu,
#pause{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:white;
    text-align:center;

    background:
        linear-gradient(
            rgba(0,0,0,.25),
            rgba(0,0,0,.72)
        ),
        #477ca0;
}

#pause{
    display:none;
}

.logo{
    width:125px;
    height:125px;
    object-fit:contain;
    border-radius:24px;
    filter:drop-shadow(0 8px 20px #000);
    margin-bottom:15px;
}

.title{
    font-size:clamp(38px,8vw,72px);
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 5px 15px #000;
}

.subtitle{
    margin-top:5px;
    margin-bottom:25px;
    opacity:.9;
}

.btn{
    width:min(330px,82vw);
    margin:6px;
    padding:15px 20px;

    border:2px solid rgba(255,255,255,.6);
    border-radius:12px;

    color:white;
    background:rgba(20,20,20,.75);

    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    background:rgba(255,255,255,.18);
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    background:#111;
}

.loader{
    width:55px;
    height:55px;
    border-radius:50%;
    border:5px solid #444;
    border-top-color:white;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:none;
}

#info{
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    font-size:13px;
    line-height:1.5;
    text-shadow:0 2px 5px #000;
}

#pauseBtn{
    pointer-events:auto;
    position:absolute;
    right:12px;
    top:12px;
    width:45px;
    height:45px;
    border-radius:10px;
    border:1px solid white;
    color:white;
    background:rgba(0,0,0,.5);
    font-size:20px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:18px;
    height:18px;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 1px 4px #000;
}

#crosshair:before{
    width:18px;
    height:2px;
    left:0;
    top:8px;
}

#crosshair:after{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#toast{
    position:absolute;
    left:50%;
    top:16%;
    transform:translateX(-50%);
    padding:10px 16px;
    color:white;
    background:rgba(0,0,0,.7);
    border-radius:8px;
    opacity:0;
    transition:.2s;
}

#toast.show{
    opacity:1;
}

#hotbar{
    position:absolute;
    left:50%;
    bottom:15px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:6px;
    border-radius:10px;
    background:rgba(0,0,0,.55);
}

.slot{
    width:52px;
    height:52px;
    position:relative;
    overflow:hidden;
    border:2px solid #666;
    border-radius:7px;
    background:#222;
}

.slot.selected{
    border-color:white;
    box-shadow:0 0 12px white;
}

.slot img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.slot span{
    position:absolute;
    top:2px;
    left:4px;
    color:white;
    font-size:11px;
    text-shadow:0 2px 3px #000;
}

#mobile{
    display:none;
    position:absolute;
    inset:0;
}

#joystick{
    position:absolute;
    left:22px;
    bottom:90px;
    width:125px;
    height:125px;
    border:2px solid rgba(255,255,255,.35);
    border-radius:50%;
    background:rgba(0,0,0,.2);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    left:33px;
    top:33px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
}

.mbtn{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.6);
    color:white;
    background:rgba(0,0,0,.45);
    font-weight:bold;
    pointer-events:auto;
}

#jump{
    right:25px;
    bottom:125px;
}

#break{
    right:100px;
    bottom:60px;
}

#place{
    right:25px;
    bottom:55px;
}

#mobilePause{
    right:25px;
    top:70px;
}

#look{
    position:absolute;
    right:0;
    top:0;
    width:60%;
    height:70%;
    pointer-events:auto;
}

@media(max-width:800px){

    #mobile{
        display:block;
    }

    #hotbar{
        bottom:5px;
        max-width:96vw;
    }

    .slot{
        width:40px;
        height:40px;
    }

    #info{
        font-size:10px;
    }
}
</style>
</head>

<body>

<div id="loading">
    <div class="loader"></div>
    <div style="margin-top:15px">
        Creating RishantCraft world...
    </div>
</div>

<div id="menu">

    <img src="logo.png" class="logo">

    <div class="title">
        RishantCraft
    </div>

    <div class="subtitle">
        Explore • Build • Discover
    </div>

    <button class="btn" id="play">
        ▶ PLAY
    </button>

    <button class="btn" id="newWorld">
        🌎 NEW WORLD
    </button>

    <div style="font-size:12px;opacity:.75;margin-top:15px">
        W A S D • Mouse • Space • Shift
    </div>

</div>

<div id="pause">

    <img src="logo.png" class="logo">

    <div class="title" style="font-size:42px">
        PAUSED
    </div>

    <button class="btn" id="resume">
        ▶ Resume
    </button>

    <button class="btn" id="save">

    </button>

    <button class="btn" id="home">

    </button>

</div>

<div id="hud">

    <div id="info">
        <b>RishantCraft</b><br>
        <span id="xyz">XYZ: 0 0 0</span><br>
        <span id="fps">FPS: --</span>
    </div>

    <button id="pauseBtn">
        Ⅱ
    </button>

    <div id="crosshair"></div>

    <div id="toast"></div>

    <div id="hotbar"></div>

    <div id="mobile">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <div id="look"></div>

        <button class="mbtn" id="jump">
            ↑
        </button>

        <button class="mbtn" id="break">
            ✕
        </button>

        <button class="mbtn" id="place">
            +
        </button>

        <button class="mbtn" id="mobilePause">
            Ⅱ
        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>

<script>

/* =========================================================
   RISHANTCRAFT FIXED VERSION
   ALL FILES ARE IN SAME GITHUB ROOT FOLDER
   ========================================================= */


/* =========================================================
   ASSET PATHS
   ========================================================= */

const ASSETS = {

    grass:
        "tileable_grass_00.png",

    dirt:
        "dirt1.png",

    stone:
        "handpaintedwall2.png",

    sand:
        "Sand2_S.jpg",

    wood:
        "wood1.jpg",

    leaves:
        "LongLeaves_S.jpg",

    glass:
        "Transparent.png",

    brick:
        "bricksx64.png",

    door:
        "door.png",

    water:
        "tex_Water.jpg",

    villagerDiffuse:
        "ManTextured_diffuse.png",

    villagerNormal:
        "ManTextured_normal.png",

    villagerMetal:
        "ManTextured_Metallic.png",

    villagerModel:
        "EmoPreben Man Model 1.fbx",

    walkSound:
        "walk.mp3",

    breakSound:
        "break.mp3",

    music:
        "back.mp3"
};


/* =========================================================
   RENDERER
   ========================================================= */

const canvas=
    document.createElement("canvas");

document.body.insertBefore(
    canvas,
    document.body.firstChild
);

const renderer=
    new THREE.WebGLRenderer({
        canvas:canvas,
        antialias:false,
        powerPreference:"high-performance"
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        1.35
    )
);

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.outputColorSpace=
    THREE.SRGBColorSpace;


/* =========================================================
   SCENE
   ========================================================= */

const scene=
    new THREE.Scene();

scene.background=
    new THREE.Color(0x7fc7ee);

scene.fog=
    new THREE.Fog(
        0x7fc7ee,
        45,
        150
    );


/* =========================================================
   CAMERA
   ========================================================= */

const camera=
    new THREE.PerspectiveCamera(
        75,
        innerWidth/innerHeight,
        .05,
        400
    );

camera.rotation.order=
    "YXZ";


/* =========================================================
   LIGHT
   ========================================================= */

const ambient=
    new THREE.HemisphereLight(
        0xffffff,
        0x665544,
        1.5
    );

scene.add(ambient);

const sun=
    new THREE.DirectionalLight(
        0xffffff,
        2
    );

sun.position.set(
    50,
    100,
    40
);

scene.add(sun);


/* =========================================================
   TEXTURE LOADER
   ========================================================= */

const loader=
    new THREE.TextureLoader();

const textures={};

function texture(path){

    if(textures[path]){
        return textures[path];
    }

    const t=
        loader.load(
            path,
            ()=>{
                t.needsUpdate=true;
            },
            undefined,
            ()=>{
                console.warn(
                    "Missing asset:",
                    path
                );
            }
        );

    t.colorSpace=
        THREE.SRGBColorSpace;

    t.wrapS=
        THREE.RepeatWrapping;

    t.wrapT=
        THREE.RepeatWrapping;

    textures[path]=t;

    return t;
}


/* =========================================================
   BLOCK DATA
   ========================================================= */

const BLOCK_DATA={

    grass:{
        map:ASSETS.grass
    },

    dirt:{
        map:ASSETS.dirt
    },

    stone:{
        map:ASSETS.stone
    },

    sand:{
        map:ASSETS.sand
    },

    wood:{
        map:ASSETS.wood
    },

    leaves:{
        map:ASSETS.leaves,
        transparent:true
    },

    glass:{
        map:ASSETS.glass,
        transparent:true
    },

    brick:{
        map:ASSETS.brick
    },

    water:{
        map:ASSETS.water,
        transparent:true,
        opacity:.65
    }
};

const materials={};

function material(type){

    if(materials[type]){
        return materials[type];
    }

    const data=
        BLOCK_DATA[type];

    const mat=
        new THREE.MeshLambertMaterial({
            map:texture(data.map),
            transparent:!!data.transparent,
            opacity:data.opacity||1,
            alphaTest:
                data.transparent
                ? .05
                : 0,
            side:
                data.transparent
                ? THREE.DoubleSide
                : THREE.FrontSide
        });

    materials[type]=mat;

    return mat;
}


/* =========================================================
   WORLD SETTINGS
   ========================================================= */

const CHUNK=16;

const MAX_HEIGHT=24;

/*
 * 5x5 active chunks.
 * Much lighter than thousands of individual meshes.
 */
const RENDER_DISTANCE=2;

let seed=
    Math.floor(
        Math.random()*1000000000
    );

const edits=
    new Map();

const chunks=
    new Map();

const chunkMeshes=
    new Map();


/* =========================================================
   WORLD HASH / NOISE
   ========================================================= */

function hash(x,z){

    let n=
        x*374761393+
        z*668265263+
        seed*1442695041;

    n=
        (n^(n>>>13))*
        1274126177;

    n^=
        n>>>16;

    return(
        (n>>>0)/
        4294967295
    );
}

function noise(x,z){

    const x0=Math.floor(x);
    const z0=Math.floor(z);

    const fx=x-x0;
    const fz=z-z0;

    const a=hash(x0,z0);
    const b=hash(x0+1,z0);
    const c=hash(x0,z0+1);
    const d=hash(x0+1,z0+1);

    const u=
        fx*fx*(3-2*fx);

    const v=
        fz*fz*(3-2*fz);

    return THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(a,b,u),
        THREE.MathUtils.lerp(c,d,u),
        v
    );
}


/* =========================================================
   TERRAIN
   ========================================================= */

function terrain(x,z){

    let h=
        7+
        noise(x*.035,z*.035)*8+
        noise(x*.085,z*.085)*3;

    /*
     * River
     */
    const riverWave=
        Math.sin(
            x*.045+
            Math.sin(z*.018)*3
        );

    if(
        Math.abs(riverWave)<.12
    ){
        h-=4;
    }

    /*
     * Lake areas
     */
    const lake=
        noise(
            x*.012,
            z*.012
        );

    if(lake>.80){
        h-=5;
    }

    return Math.max(
        2,
        Math.min(
            20,
            Math.floor(h)
        )
    );
}


/* =========================================================
   BASE BLOCK
   ========================================================= */

function baseBlock(x,y,z){

    if(y<0){
        return "stone";
    }

    if(y>=MAX_HEIGHT){
        return null;
    }

    const h=
        terrain(x,z);

    /*
     * Water level
     */
    const SEA=6;

    /*
     * Terrain
     */
    if(y<=h){

        if(y===h){

            if(h<=SEA+1){
                return "sand";
            }

            return "grass";
        }

        if(y>=h-2){
            return "dirt";
        }

        return "stone";
    }

    /*
     * Lake / river
     */
    if(
        h<SEA &&
        y<=SEA
    ){
        return "water";
    }

    /*
     * Simple waterfall
     */
    const neighbours=[
        terrain(x+1,z),
        terrain(x-1,z),
        terrain(x,z+1),
        terrain(x,z-1)
    ];

    const high=
        Math.max(...neighbours);

    if(
        h<SEA &&
        high-h>=4 &&
        y>h &&
        y<=h+4
    ){
        return "water";
    }

    /*
     * Trees
     */
    const rootY=h+1;

    for(let rx=x-2;rx<=x+2;rx++){

        for(let rz=z-2;rz<=z+2;rz++){

            const rh=
                terrain(rx,rz);

            if(
                rh<8 ||
                hash(rx+1000,rz+2000)<.965
            ){
                continue;
            }

            const dy=
                y-rootY;

            const dx=
                x-rx;

            const dz=
                z-rz;

            if(
                dx===0 &&
                dz===0 &&
                dy>=0 &&
                dy<=4
            ){
                return "wood";
            }

            if(
                dy>=2 &&
                dy<=5 &&
                Math.abs(dx)<=2 &&
                Math.abs(dz)<=2
            ){
                return "leaves";
            }
        }
    }

    return null;
}


/* =========================================================
   GET / SET
   ========================================================= */

function block(x,y,z){

    x=Math.floor(x);
    y=Math.floor(y);
    z=Math.floor(z);

    const k=
        `${x},${y},${z}`;

    if(edits.has(k)){
        return edits.get(k);
    }

    return baseBlock(x,y,z);
}

function setBlock(x,y,z,type){

    x=Math.floor(x);
    y=Math.floor(y);
    z=Math.floor(z);

    if(y<0 || y>=MAX_HEIGHT){
        return;
    }

    edits.set(
        `${x},${y},${z}`,
        type
    );
}


/* =========================================================
   VILLAGES
   ========================================================= */

const villages=
    new Set();

const villageVillagers=[];

function villageKey(cx,cz){
    return `${cx},${cz}`;
}

function generateVillage(cx,cz){

    const vk=
        villageKey(cx,cz);

    if(villages.has(vk)){
        return;
    }

    villages.add(vk);

    const x=
        cx*CHUNK+7;

    const z=
        cz*CHUNK+7;

    const ground=
        terrain(x,z);

    /*
     * Don't spawn village inside water.
     */
    if(ground<8){
        return;
    }

    const houses=[
        [x,z],
        [x+9,z],
        [x,z+9],
        [x+9,z+9]
    ];

    houses.forEach(
        ([hx,hz],i)=>{
            makeHouse(
                hx,
                terrain(hx,hz)+1,
                hz,
                i
            );
        }
    );

    /*
     * Villagers
     */
    for(let i=0;i<3;i++){

        villageVillagers.push({
            x:x+3+i*4,
            z:z+4,
            homeX:x+5,
            homeZ:z+5,
            timer:Math.random()*5,
            angle:Math.random()*Math.PI*2,
            object:null
        });
    }
}

function makeHouse(x,y,z,index){

    const W=6;
    const D=6;
    const H=4;

    /*
     * Floor
     */
    for(let dx=0;dx<W;dx++){

        for(let dz=0;dz<D;dz++){

            setBlock(
                x+dx,
                y,
                z+dz,
                "wood"
            );
        }
    }

    /*
     * Walls
     */
    for(let yy=1;yy<=H;yy++){

        for(let dx=0;dx<W;dx++){

            if(
                !(dx===2 && yy<=2)
            ){

                setBlock(
                    x+dx,
                    y+yy,
                    z,
                    "brick"
                );
            }

            setBlock(
                x+dx,
                y+yy,
                z+D-1,
                "brick"
            );
        }

        for(let dz=0;dz<D;dz++){

            setBlock(
                x,
                y+yy,
                z+dz,
                "brick"
            );

            setBlock(
                x+W-1,
                y+yy,
                z+dz,
                "brick"
            );
        }
    }

    /*
     * Roof
     */
    for(let dx=-1;dx<=W;dx++){

        for(let dz=-1;dz<=D;dz++){

            setBlock(
                x+dx,
                y+H+1,
                z+dz,
                "wood"
            );
        }
    }

    /*
     * Door opening
     */
    setBlock(
        x+2,
        y+1,
        z,
        null
    );

    setBlock(
        x+2,
        y+2,
        z,
        null
    );

    addDoor(
        x+2,
        y+1,
        z,
        false
    );
}


/* =========================================================
   CHUNK MESH GENERATION
   ========================================================= */

const cube=
    new THREE.BoxGeometry(
        1,1,1
    );

function visibleBlock(x,y,z,type){

    const neighbours=[
        block(x+1,y,z),
        block(x-1,y,z),
        block(x,y+1,z),
        block(x,y-1,z),
        block(x,y,z+1),
        block(x,y,z-1)
    ];

    /*
     * Water needs visible surface.
     */
    if(type==="water"){

        return neighbours.some(
            n=>!n || n!=="water"
        );
    }

    return neighbours.some(
        n=>!n ||
        n==="water" ||
        n==="glass" ||
        n==="leaves"
    );
}

function rebuildChunk(cx,cz){

    const ck=
        `${cx},${cz}`;

    const old=
        chunkMeshes.get(ck);

    if(old){

        scene.remove(old);
    }

    const group=
        new THREE.Group();

    /*
     * Store positions by material.
     */
    const buckets={};

    const sx=
        cx*CHUNK;

    const sz=
        cz*CHUNK;

    for(let x=sx;x<sx+CHUNK;x++){

        for(let z=sz;z<sz+CHUNK;z++){

            for(
                let y=0;
                y<MAX_HEIGHT;
                y++
            ){

                const type=
                    block(x,y,z);

                if(!type) continue;

                if(type==="door") continue;

                if(
                    !visibleBlock(
                        x,y,z,type
                    )
                ){
                    continue;
                }

                if(!buckets[type]){
                    buckets[type]=[];
                }

                buckets[type].push({
                    x,y,z
                });
            }
        }
    }

    for(
        const type of Object.keys(buckets)
    ){

        const list=
            buckets[type];

        if(!list.length) continue;

        const mesh=
            new THREE.InstancedMesh(
                cube,
                material(type),
                list.length
            );

        const dummy=
            new THREE.Object3D();

        for(
            let i=0;
            i<list.length;
            i++
        ){

            const p=list[i];

            dummy.position.set(
                p.x+.5,
                p.y+.5,
                p.z+.5
            );

            dummy.rotation.set(
                0,0,0
            );

            dummy.scale.set(
                1,1,1
            );

            dummy.updateMatrix();

            mesh.setMatrixAt(
                i,
                dummy.matrix
            );
        }

        mesh.instanceMatrix.needsUpdate=true;

        mesh.userData.blocks=
            list;

        mesh.userData.type=
            type;

        group.add(mesh);
    }

    scene.add(group);

    chunkMeshes.set(
        ck,
        group
    );
}


/* =========================================================
   CHUNK LOADING
   ========================================================= */

function loadChunksAroundPlayer(){

    const pcx=
        Math.floor(
            player.x/CHUNK
        );

    const pcz=
        Math.floor(
            player.z/CHUNK
        );

    for(
        let dx=-RENDER_DISTANCE;
        dx<=RENDER_DISTANCE;
        dx++
    ){

        for(
            let dz=-RENDER_DISTANCE;
            dz<=RENDER_DISTANCE;
            dz++
        ){

            const cx=pcx+dx;
            const cz=pcz+dz;

            const ck=
                `${cx},${cz}`;

            if(!chunks.has(ck)){

                chunks.set(
                    ck,
                    true
                );

                generateVillage(
                    cx,
                    cz
                );

                rebuildChunk(
                    cx,
                    cz
                );
            }
        }
    }

    /*
     * Rebuild chunks around newly generated villages.
     */
    for(
        let dx=-RENDER_DISTANCE;
        dx<=RENDER_DISTANCE;
        dx++
    ){

        for(
            let dz=-RENDER_DISTANCE;
            dz<=RENDER_DISTANCE;
            dz++
        ){

            const cx=pcx+dx;
            const cz=pcz+dz;

            rebuildChunk(
                cx,
                cz
            );
        }
    }

    /*
     * Unload distant chunks.
     */
    for(
        const [ck,group]
        of chunkMeshes
    ){

        const [cx,cz]=
            ck.split(",").map(Number);

        if(
            Math.abs(cx-pcx)>
                RENDER_DISTANCE+1 ||
            Math.abs(cz-pcz)>
                RENDER_DISTANCE+1
        ){

            scene.remove(group);

            chunkMeshes.delete(ck);
            chunks.delete(ck);
        }
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

const player={

    x:.5,
    y:10,
    z:.5,

    velocityY:0,

    yaw:0,
    pitch:0,

    height:1.8,
    radius:.28,

    onGround:false
};

function solid(x,y,z){

    const b=
        block(
            Math.floor(x),
            Math.floor(y),
            Math.floor(z)
        );

    return (
        b &&
        b!=="water" &&
        b!=="leaves" &&
        b!=="glass" &&
        b!=="door"
    );
}

function collision(px,py,pz){

    const r=
        player.radius;

    const minX=
        Math.floor(px-r);

    const maxX=
        Math.floor(px+r);

    const minY=
        Math.floor(py);

    const maxY=
        Math.floor(
            py+player.height-.05
        );

    const minZ=
        Math.floor(pz-r);

    const maxZ=
        Math.floor(pz+r);

    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let y=minY;
            y<=maxY;
            y++
        ){

            for(
                let z=minZ;
                z<=maxZ;
                z++
            ){

                if(solid(x,y,z)){
                    return true;
                }
            }
        }
    }

    return false;
}

/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

let mobileForward=0;
let mobileSide=0;

function updatePlayer(dt){

    if(paused) return;

    let forward=0;
    let side=0;

    if(keys.KeyW) forward++;
    if(keys.KeyS) forward--;
    if(keys.KeyD) side++;
    if(keys.KeyA) side--;

    forward+=mobileForward;
    side+=mobileSide;

    const len=
        Math.hypot(
            forward,
            side
        );

    if(len>1){

        forward/=len;
        side/=len;
    }

    const sprint=
        keys.ShiftLeft ||
        keys.ShiftRight;

    const speed=
        sprint
        ? 8
        : 5.2;

    const sin=
        Math.sin(player.yaw);

    const cos=
        Math.cos(player.yaw);

    const dx=
        -sin*forward+
        cos*side;

    const dz=
        -cos*forward-
        sin*side;

    let vx=
        dx*speed;

    let vz=
        dz*speed;

    /*
     * X
     */
    const nx=
        player.x+vx*dt;

    if(
        !collision(
            nx,
            player.y,
            player.z
        )
    ){

        player.x=nx;
    }

    /*
     * Z
     */
    const nz=
        player.z+vz*dt;

    if(
        !collision(
            player.x,
            player.y,
            nz
        )
    ){

        player.z=nz;
    }

    /*
     * Gravity
     */
    player.velocityY-=22*dt;

    const ny=
        player.y+
        player.velocityY*dt;

    if(
        !collision(
            player.x,
            ny,
            player.z
        )
    ){

        player.y=ny;
        player.onGround=false;

    }else{

        if(
            player.velocityY<0
        ){

            player.onGround=true;
        }

        player.velocityY=0;
    }

    /*
     * Respawn
     */
    if(player.y<-15){

        player.y=
            terrain(
                Math.floor(player.x),
                Math.floor(player.z)
            )+2;
    }

    camera.position.set(
        player.x,
        player.y+1.62,
        player.z
    );

    camera.rotation.y=
        player.yaw;

    camera.rotation.x=
        player.pitch;

    /*
     * Walking sound
     */
    if(
        Math.abs(vx)+
        Math.abs(vz)>.2 &&
        player.onGround
    ){

        playWalk();

    }else{

        stopWalk();
    }
}


/* =========================================================
   RAYCASTING
   ========================================================= */

const raycaster=
    new THREE.Raycaster();

function target(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects=[];

    for(
        const group
        of chunkMeshes.values()
    ){

        objects.push(
            ...group.children
        );
    }

    /*
     * Doors first
     */
    objects.push(
        ...doorObjects
    );

    const hits=
        raycaster.intersectObjects(
            objects,
            true
        );

    for(const hit of hits){

        if(hit.distance>7){
            continue;
        }

        if(
            hit.object.userData &&
            hit.object.userData.door
        ){

            return {
                type:"door",
                object:hit.object,
                distance:hit.distance
            };
        }

        if(
            hit.object.isInstancedMesh &&
            hit.instanceId!==undefined
        ){

            const p=
                hit.object.userData.blocks[
                    hit.instanceId
                ];

            if(p){

                return {
                    type:"block",
                    x:p.x,
                    y:p.y,
                    z:p.z,
                    mesh:hit.object,
                    face:hit.face,
                    distance:hit.distance
                };
            }
        }
    }

    return null;
}


/* =========================================================
   BREAK
   ========================================================= */

function breakBlock(){

    const t=target();

    if(!t) return;

    if(t.type==="door"){

        removeDoor(
            t.object.userData.door
        );

        playBreak();

        return;
    }

    setBlock(
        t.x,
        t.y,
        t.z,
        null
    );

    rebuildNear(
        t.x,
        t.z
    );

    playBreak();

    toast(
        "Block broken"
    );
}


/* =========================================================
   PLACE
   ========================================================= */

let selected=0;

const hotbarTypes=[
    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "glass",
    "brick",
    "door"
];

function place(){

    const t=target();

    if(
        !t ||
        t.type!=="block" ||
        !t.face
    ){
        return;
    }

    const nx=
        Math.round(t.face.normal.x);

    const ny=
        Math.round(t.face.normal.y);

    const nz=
        Math.round(t.face.normal.z);

    const x=t.x+nx;
    const y=t.y+ny;
    const z=t.z+nz;

    if(
        y<0 ||
        y>=MAX_HEIGHT
    ){
        return;
    }

    const type=
        hotbarTypes[selected];

    /*
     * Door
     */
    if(type==="door"){

        if(
            !block(x,y,z) &&
            !block(x,y+1,z)
        ){

            addDoor(
                x,
                y,
                z,
                true
            );

            toast(
                "Door placed"
            );
        }

        return;
    }

    if(
        !block(x,y,z)
    ){

        /*
         * Prevent placing inside player.
         */
        if(
            x===Math.floor(player.x) &&
            z===Math.floor(player.z)
        ){
            return;
        }

        setBlock(
            x,y,z,type
        );

        rebuildNear(
            x,z
        );

        toast(
            type+" placed"
        );
    }
}


/* =========================================================
   DOORS
   ========================================================= */

const doorObjects=[];
const doors=[];

function addDoor(
    x,
    y,
    z,
    custom=true
){

    const door={
        x,
        y,
        z,
        open:false,
        target:0,
        custom
    };

    const pivot=
        new THREE.Group();

    pivot.position.set(
        x+.05,
        y,
        z+.05
    );

    const geo=
        new THREE.PlaneGeometry(
            .9,
            1.95
        );

    const mat=
        new THREE.MeshLambertMaterial({
            map:texture(
                ASSETS.door
            ),
            side:THREE.DoubleSide
        });

    const mesh=
        new THREE.Mesh(
            geo,
            mat
        );

    mesh.position.set(
        .45,
        .975,
        0
    );

    mesh.userData.door=door;

    pivot.add(mesh);

    door.pivot=pivot;
    door.mesh=mesh;

    scene.add(pivot);

    doorObjects.push(mesh);
    doors.push(door);

    /*
     * Door occupies two blocks logically.
     */
    setBlock(
        x,y,z,
        null
    );

    setBlock(
        x,y+1,z,
        null
    );

    return door;
}

function removeDoor(door){

    if(!door) return;

    scene.remove(
        door.pivot
    );

    const oi=
        doorObjects.indexOf(
            door.mesh
        );

    if(oi>=0){
        doorObjects.splice(oi,1);
    }

    const di=
        doors.indexOf(door);

    if(di>=0){
        doors.splice(di,1);
    }

    toast(
        "Door removed"
    );
}

function toggleDoor(door){

    if(!door) return;

    door.open=
        !door.open;

    door.target=
        door.open
        ? Math.PI/2
        : 0;
}


/* =========================================================
   DOOR ANIMATION
   ========================================================= */

function updateDoors(dt){

    for(const door of doors){

        if(!door.pivot) continue;

        door.pivot.rotation.y=
            THREE.MathUtils.lerp(
                door.pivot.rotation.y,
                door.target,
                Math.min(
                    1,
                    dt*8
                )
            );
    }
}

/* =========================================================
   REBUILD NEARBY
   ========================================================= */

function rebuildNear(x,z){

    const cx=
        Math.floor(x/CHUNK);

    const cz=
        Math.floor(z/CHUNK);

    for(let dx=-1;dx<=1;dx++){

        for(let dz=-1;dz<=1;dz++){

            const ck=
                `${cx+dx},${cz+dz}`;

            if(
                chunks.has(ck)
            ){

                rebuildChunk(
                    cx+dx,
                    cz+dz
                );
            }
        }
    }
}


/* =========================================================
   HOTBAR
   ========================================================= */

function updateHotbar(){

    const bar=
        document.getElementById(
            "hotbar"
        );

    bar.innerHTML="";

    hotbarTypes.forEach(
        (type,i)=>{

            const div=
                document.createElement(
                    "div"
                );

            div.className=
                "slot"+
                (
                    i===selected
                    ?" selected"
                    :""
                );

            const img=
                document.createElement(
                    "img"
                );

            img.src=
                BLOCK_DATA[type]
                ?BLOCK_DATA[type].map
                :ASSETS.door;

            img.onerror=()=>{
                img.style.display="none";
            };

            const span=
                document.createElement(
                    "span"
                );

            span.textContent=
                i+1;

            div.appendChild(img);
            div.appendChild(span);

            div.onclick=()=>{
                selected=i;
                updateHotbar();
            };

            bar.appendChild(div);
        }
    );
}

updateHotbar();

/* =========================================================
   SOUND
   ========================================================= */

let music=null;
let walk=null;
let breaking=null;

function setupAudio(){

    if(music) return;

    music=
        new Audio(
            ASSETS.music
        );

    walk=
        new Audio(
            ASSETS.walkSound
        );

    breaking=
        new Audio(
            ASSETS.breakSound
        );

    music.loop=true;
    walk.loop=true;

    music.volume=.28;
    walk.volume=.28;
    breaking.volume=.6;

    music.preload="auto";
    walk.preload="auto";
    breaking.preload="auto";
}

function playMenuMusic(){

    setupAudio();

    music.play().catch(
        ()=>{}
    );
}

function stopMenuMusic(){

    if(!music) return;

    music.pause();
    music.currentTime=0;
}

function playWalk(){

    setupAudio();

    if(
        walk.paused
    ){

        walk.play().catch(
            ()=>{}
        );
    }
}

function stopWalk(){

    if(!walk) return;

    walk.pause();
    walk.currentTime=0;
}

function playBreak(){

    setupAudio();

    breaking.currentTime=0;

    breaking.play().catch(
        ()=>{}
    );
}

/* =========================================================
   VILLAGER FBX
   ========================================================= */

let fbxLoaded=false;

function loadVillagerModel(){

    if(
        fbxLoaded ||
        typeof THREE.FBXLoader==="undefined"
    ){
        return;
    }

    fbxLoaded=true;

    const fbxLoader=
        new THREE.FBXLoader();

    fbxLoader.load(

        ASSETS.villagerModel,

        object=>{

            object.scale.set(
                .012,
                .012,
                .012
            );

            object.traverse(
                child=>{

                    if(!child.isMesh){
                        return;
                    }

                    const mat=
                        new THREE.MeshStandardMaterial({
                            map:texture(
                                ASSETS.villagerDiffuse
                            ),
                            normalMap:texture(
                                ASSETS.villagerNormal
                            ),
                            metalness:.15,
                            roughness:.8
                        });

                    child.material=mat;

                    child.castShadow=false;
                    child.receiveShadow=false;
                }
            );

            /*
             * Put villagers into the world.
             */
            villageVillagers.forEach(
                data=>{

                    if(data.object){
                        return;
                    }

                    const clone=
                        object.clone(true);

                    clone.position.set(
                        data.x,
                        terrain(
                            Math.floor(data.x),
                            Math.floor(data.z)
                        )+1,
                        data.z
                    );

                    scene.add(clone);

                    data.object=clone;
                }
            );

        },

        undefined,

        error=>{

            console.warn(
                "Villager FBX could not load",
                error
            );
        }
    );
}


/* =========================================================
   VILLAGER MOVEMENT
   ========================================================= */

function updateVillagers(dt){

    for(
        const v
        of villageVillagers
    ){

        if(!v.object){
            continue;
        }

        v.timer-=dt;

        if(v.timer<=0){

            v.timer=
                2+
                Math.random()*4;

            v.angle=
                Math.random()*
                Math.PI*2;
        }

        v.x+=
            Math.cos(v.angle)*
            .45*
            dt;

        v.z+=
            Math.sin(v.angle)*
            .45*
            dt;

        /*
         * Keep villager near village.
         */
        const distance=
            Math.hypot(
                v.x-v.homeX,
                v.z-v.homeZ
            );

        if(distance>10){

            v.angle=
                Math.atan2(
                    v.homeZ-v.z,
                    v.homeX-v.x
                );
        }

        const gy=
            terrain(
                Math.floor(v.x),
                Math.floor(v.z)
            );

        v.object.position.set(
            v.x,
            gy+1,
            v.z
        );

        v.object.rotation.y=
            -v.angle;
    }
}


/* =========================================================
   SAVE
   ========================================================= */

function saveWorld(){

    const data={
        seed:seed,
        edits:[
            ...edits.entries()
        ],
        player:{
            x:player.x,
            y:player.y,
            z:player.z,
            yaw:player.yaw,
            pitch:player.pitch
        }
    };

    try{

        localStorage.setItem(
            "RishantCraft_Save",
            JSON.stringify(data)
        );

        toast(
            "World saved ✓"
        );

    }catch(e){

        toast(
            "Save failed"
        );
    }
}

function loadWorld(){

    try{

        const raw=
            localStorage.getItem(
                "RishantCraft_Save"
            );

        if(!raw){
            return false;
        }

        const data=
            JSON.parse(raw);

        seed=
            data.seed||
            seed;

        edits.clear();

        for(
            const pair
            of data.edits||[]
        ){

            edits.set(
                pair[0],
                pair[1]
            );
        }

        if(data.player){

            player.x=
                data.player.x;

            player.y=
                data.player.y;

            player.z=
                data.player.z;

            player.yaw=
                data.player.yaw||0;

            player.pitch=
                data.player.pitch||0;
        }

        return true;

    }catch(e){

        return false;
    }
}


/* =========================================================
   NEW WORLD
   ========================================================= */

function createNewWorld(){

    seed=
        Math.floor(
            Math.random()*1000000000
        );

    edits.clear();
    chunks.clear();

    for(
        const group
        of chunkMeshes.values()
    ){

        scene.remove(group);
    }

    chunkMeshes.clear();

    player.x=.5;
    player.z=.5;

    player.y=
        terrain(0,0)+2;

    player.velocityY=0;

    player.yaw=0;
    player.pitch=0;

    toast(
        "New world created"
    );
}


/* =========================================================
   GAME STATE
   ========================================================= */

let gameStarted=false;
let paused=false;

function startGame(newWorld=false){

    document.getElementById(
        "loading"
    ).style.display="flex";

    setupAudio();

    if(newWorld){

        createNewWorld();

    }else{

        if(!loadWorld()){

            player.x=.5;
            player.z=.5;

            player.y=
                terrain(0,0)+2;
        }
    }

    /*
     * Generate first area.
     */
    loadChunksAroundPlayer();

    /*
     * Villager model.
     */
    loadVillagerModel();

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="block";

    document.getElementById(
        "loading"
    ).style.display="none";

    gameStarted=true;
    paused=false;

    stopMenuMusic();

    /*
     * Browser audio gets user gesture
     * from this button click.
     */
    setupAudio();

    if(!mobile()){

        canvas.requestPointerLock?.();
    }

    toast(
        "Welcome to RishantCraft!"
    );
}


/* =========================================================
   PAUSE
   ========================================================= */

function togglePause(){

    if(!gameStarted){
        return;
    }

    paused=!paused;

    document.getElementById(
        "pause"
    ).style.display=
        paused
        ?"flex"
        :"none";

    if(paused){

        stopWalk();

        if(
            document.pointerLockElement
        ){

            document.exitPointerLock();
        }

    }else{

        if(!mobile()){

            canvas.requestPointerLock?.();
        }
    }
}

document.getElementById(
    "home"
).onclick=()=>{

    saveWorld();

    gameStarted=false;
    paused=false;

    stopWalk();
    stopMenuMusic();

    if(
        document.pointerLockElement
    ){

        document.exitPointerLock();
    }

    document.getElementById(
        "pause"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="flex";

    playMenuMusic();
};


/* =========================================================
   MOBILE JOYSTICK
   ========================================================= */

const joystick=
    document.getElementById(
        "joystick"
    );

const stick=
    document.getElementById(
        "stick"
    );

let joyActive=false;

joystick.addEventListener(
    "touchstart",
    e=>{

        joyActive=true;

        moveJoystick(
            e.touches[0]
        );

    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e=>{

        if(!joyActive) return;

        moveJoystick(
            e.touches[0]
        );

        e.preventDefault();

    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    ()=>{

        joyActive=false;

        mobileForward=0;
        mobileSide=0;

        stick.style.left="33px";
        stick.style.top="33px";
    }
);

function moveJoystick(t){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=
        t.clientX-cx;

    let dy=
        t.clientY-cy;

    const max=45;

    const length=
        Math.hypot(dx,dy);

    if(length>max){

        dx=
            dx/length*max;

        dy=
            dy/length*max;
    }

    stick.style.left=
        33+dx+"px";

    stick.style.top=
        33+dy+"px";

    mobileSide=
        dx/max;

    mobileForward=
        -dy/max;
}


/* =========================================================
   MOBILE LOOK
   ========================================================= */

const look=
    document.getElementById(
        "look"
    );

let lookData=null;

look.addEventListener(
    "touchstart",
    e=>{

        if(!e.touches.length){
            return;
        }

        const t=e.touches[0];

        lookData={
            x:t.clientX,
            y:t.clientY
        };
    },
    {passive:true}
);

look.addEventListener(
    "touchmove",
    e=>{

        if(!lookData){
            return;
        }

        const t=e.touches[0];

        const dx=
            t.clientX-lookData.x;

        const dy=
            t.clientY-lookData.y;

        player.yaw-=
            dx*.006;

        player.pitch-=
            dy*.006;

        player.pitch=
            Math.max(
                -1.52,
                Math.min(
                    1.52,
                    player.pitch
                )
            );

        lookData.x=t.clientX;
        lookData.y=t.clientY;
    },
    {passive:true}
);

look.addEventListener(
    "touchend",
    ()=>{
        lookData=null;
    }
);


/* =========================================================
   MOBILE ACTIONS
   ========================================================= */

document.getElementById(
    "jump"
).addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        if(player.onGround){

            player.velocityY=
                8.3;
        }
    },
    {passive:false}
);

document.getElementById(
    "break"
).addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        breakBlock();
    },
    {passive:false}
);

document.getElementById(
    "place"
).addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        const t=target();

        if(
            t &&
            t.type==="door"
        ){

            toggleDoor(
                t.object.userData.door
            );

        }else{

            place();
        }
    },
    {passive:false}
);


/* =========================================================
   MOBILE CHECK
   ========================================================= */

function mobile(){

    return(
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        ) ||
        innerWidth<800
    );
}


/* =========================================================
   HUD
   ========================================================= */

let fpsFrames=0;
let fpsTimer=0;

function updateHUD(dt){

    fpsFrames++;
    fpsTimer+=dt;

    if(fpsTimer>=1){

        document.getElementById(
            "fps"
        ).textContent=
            "FPS: "+
            fpsFrames;

        fpsFrames=0;
        fpsTimer=0;
    }

    document.getElementById(
        "xyz"
    ).textContent=
        "XYZ: "+
        Math.floor(player.x)+
        " "+
        Math.floor(player.y)+
        " "+
        Math.floor(player.z);
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;

function toast(text){

    const el=
        document.getElementById(
            "toast"
        );

    el.textContent=text;

    el.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer=
        setTimeout(
            ()=>{
                el.classList.remove(
                    "show"
                );
            },
            1500
        );
}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   GAME LOOP
   ========================================================= */

let previous=
    performance.now();

let chunkTimer=0;

function animate(){

    requestAnimationFrame(
        animate
    );

    const now=
        performance.now();

    let dt=
        (now-previous)/1000;

    previous=now;

    dt=
        Math.min(
            dt,
            .05
        );

    if(
        gameStarted &&
        !paused
    ){

        updatePlayer(dt);

        updateDoors(dt);

        updateVillagers(dt);

        updateHUD(dt);

        chunkTimer+=dt;

        /*
         * Don't rebuild chunks every frame.
         */
        if(chunkTimer>1){

            loadChunksAroundPlayer();

            chunkTimer=0;
        }
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL
   ========================================================= */

updateHotbar();

setupAudio();

/*
 * Menu music can only start after
 * browser user interaction.
 */
document.addEventListener(
    "click",
    ()=>{
        if(!gameStarted){
            playMenuMusic();
        }
    },
    {passive:true}
);

animate();

</script>
