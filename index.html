<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RishantCraft</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,Helvetica,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

#menu,
#pauseMenu{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
        linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.72)),
        #111;
    color:white;
}

#menu{
    background-size:cover;
    background-position:center;
}

.menuLogo{
    width:120px;
    height:120px;
    object-fit:contain;
    border-radius:24px;
    margin-bottom:15px;
    filter:drop-shadow(0 8px 20px #000);
}

h1{
    margin:0 0 8px;
    font-size:clamp(35px,7vw,70px);
    letter-spacing:3px;
    text-shadow:0 5px 15px #000;
}

.subtitle{
    opacity:.85;
    margin-bottom:28px;
}

.menuBtn{
    width:min(330px,82vw);
    padding:15px 20px;
    margin:7px;
    border:2px solid rgba(255,255,255,.55);
    border-radius:12px;
    background:rgba(30,30,30,.85);
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.menuBtn:hover{
    background:rgba(70,70,70,.95);
}

#loading{
    display:none;
    position:fixed;
    z-index:100;
    inset:0;
    background:#000;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
}

.loader{
    width:55px;
    height:55px;
    border:5px solid #444;
    border-top-color:white;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

#hud{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
    display:none;
}

#top{
    position:absolute;
    top:12px;
    left:12px;
    color:white;
    text-shadow:0 2px 5px #000;
    font-size:13px;
    line-height:1.5;
}

#pauseBtn{
    pointer-events:auto;
    position:absolute;
    top:12px;
    right:12px;
    width:45px;
    height:45px;
    border:1px solid #aaa;
    border-radius:10px;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:20px;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:18px;
    height:18px;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:18px;
    height:2px;
    top:8px;
    left:0;
}

#crosshair:after{
    width:2px;
    height:18px;
    left:8px;
    top:0;
}

#hint{
    position:absolute;
    left:50%;
    bottom:110px;
    transform:translateX(-50%);
    color:white;
    font-size:13px;
    text-shadow:0 2px 4px #000;
    white-space:nowrap;
}

#toast{
    position:absolute;
    left:50%;
    top:18%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.72);
    color:white;
    padding:10px 16px;
    border-radius:8px;
    opacity:0;
    transition:.25s;
}

#toast.show{
    opacity:1;
}

#hotbar{
    position:absolute;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:5px;
    padding:6px;
    border-radius:10px;
    background:rgba(0,0,0,.48);
}

.slot{
    width:55px;
    height:55px;
    border:2px solid #666;
    border-radius:9px;
    background:rgba(25,30,27,.85);
    position:relative;
    overflow:hidden;
}

.slot.selected{
    border-color:white;
    box-shadow:0 0 12px white;
}

.slot img{
    width:100%;
    height:100%;
    object-fit:cover;
    image-rendering:auto;
}

.slotNum{
    position:absolute;
    left:4px;
    top:2px;
    color:white;
    font-size:11px;
    text-shadow:0 2px 3px #000;
}

/* Mobile controls */
#mobileControls{
    display:none;
    position:absolute;
    inset:0;
}

#joystick{
    position:absolute;
    left:25px;
    bottom:105px;
    width:125px;
    height:125px;
    border:2px solid rgba(255,255,255,.3);
    border-radius:50%;
    background:rgba(0,0,0,.18);
    pointer-events:auto;
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(255,255,255,.4);
    left:33px;
    top:33px;
}

.mobileBtn{
    position:absolute;
    width:60px;
    height:60px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.6);
    background:rgba(0,0,0,.45);
    color:white;
    font-weight:bold;
    pointer-events:auto;
}

#jumpBtn{
    right:28px;
    bottom:130px;
}

#breakBtn{
    right:100px;
    bottom:75px;
}

#placeBtn{
    right:28px;
    bottom:58px;
}

#mobilePause{
    right:28px;
    top:70px;
}

#lookArea{
    position:absolute;
    right:0;
    top:0;
    width:60%;
    height:70%;
    pointer-events:auto;
}

/* Desktop/mobile */
@media(max-width:800px){
    #mobileControls{
        display:block;
    }

    #hint{
        display:none;
    }

    #hotbar{
        bottom:8px;
        max-width:95vw;
        overflow:hidden;
    }

    .slot{
        width:40px;
        height:40px;
    }

    #top{
        font-size:11px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
    <div class="loader"></div>
    <div style="margin-top:15px">Generating world...</div>
</div>

<div id="menu">
    <img class="menuLogo" src="logo.png" alt="RishantCraft">
    <h1>RishantCraft</h1>
    <div class="subtitle">A block world adventure</div>

    <button class="menuBtn" id="playBtn">▶ Play Game</button>
    <button class="menuBtn" id="newBtn">🌎 New World</button>

    <div style="margin-top:15px;font-size:12px;opacity:.7">
        W A S D • Mouse • Space • Shift
    </div>
</div>

<div id="pauseMenu" style="display:none">
    <img class="menuLogo" src="logo.png" alt="">
    <h1 style="font-size:42px">Paused</h1>

    <button class="menuBtn" id="resumeBtn">▶ Resume</button>
    <button class="menuBtn" id="saveBtn">💾 Save World</button>
    <button class="menuBtn" id="mainMenuBtn">⌂ Main Menu</button>
</div>

<div id="hud">

    <div id="top">
        <b>RishantCraft</b><br>
        <span id="coords">XYZ: 0 0 0</span><br>
        <span id="fps">FPS: --</span>
    </div>

    <button id="pauseBtn">Ⅱ</button>

    <div id="crosshair"></div>

    <div id="hint">
        WASD • SPACE Jump • SHIFT Sprint • Left Click Break • Right Click Place • E Pause
    </div>

    <div id="toast"></div>

    <div id="hotbar"></div>

    <div id="mobileControls">

        <div id="joystick">
            <div id="stick"></div>
        </div>

        <div id="lookArea"></div>

        <button class="mobileBtn" id="jumpBtn">↑</button>
        <button class="mobileBtn" id="breakBtn">✕</button>
        <button class="mobileBtn" id="placeBtn">＋</button>
        <button class="mobileBtn" id="mobilePause">Ⅱ</button>

    </div>
</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- FBX Loader -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>

<script>
/* =========================================================
   RISHANTCRAFT
   ========================================================= */

const ASSETS = {

    textures:{
        grass:"textures/tileable_grass_00.png",
        dirt:"textures/dirt1.png",
        stone:"textures/handpaintedwall2.png",
        sand:"textures/Sand2_S.jpg",
        wood:"textures/wood1.jpg",
        leaves:"textures/LongLeaves_S.jpg",
        glass:"textures/Transparent.png",
        brick:"textures/bricksx64.png",
        door:"textures/door.png",
        water:"textures/tex_Water.png",
        villager:"textures/villager.png"
    },

    sounds:{
        walk:"sounds/walk.mp3",
        break:"sounds/break.mp3",
        back:"sounds/back.mp3"
    },

    villagerModel:"models/villager.fbx"
};


/* =========================================================
   BASIC SETUP
   ========================================================= */

const canvas = document.getElementById("game");

const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b9df);

scene.fog = new THREE.Fog(
    0x87b9df,
    45,
    145
);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .05,
    500
);

camera.rotation.order = "YXZ";


/* =========================================================
   LIGHTING
   ========================================================= */

const hemi = new THREE.HemisphereLight(
    0xbfe6ff,
    0x594b39,
    1.45
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    1.8
);

sun.position.set(50,90,30);
sun.castShadow = true;

sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* =========================================================
   TEXTURES
   ========================================================= */

const textureLoader = new THREE.TextureLoader();

const textureCache = {};

function loadTexture(path){

    if(textureCache[path]){
        return textureCache[path];
    }

    const texture = textureLoader.load(
        path,
        ()=>{
            texture.needsUpdate = true;
        },
        undefined,
        ()=>{
            console.warn("Texture not found:",path);
        }
    );

    texture.wrapS = THREE.RepeatWrapping;
    texture.wrapT = THREE.RepeatWrapping;

    texture.anisotropy =
        renderer.capabilities.getMaxAnisotropy();

    textureCache[path] = texture;

    return texture;
}


/* =========================================================
   BLOCK DEFINITIONS
   ========================================================= */

const BLOCKS = {

    grass:{
        name:"Grass",
        texture:ASSETS.textures.grass
    },

    dirt:{
        name:"Dirt",
        texture:ASSETS.textures.dirt
    },

    stone:{
        name:"Stone",
        texture:ASSETS.textures.stone
    },

    sand:{
        name:"Sand",
        texture:ASSETS.textures.sand
    },

    wood:{
        name:"Wood",
        texture:ASSETS.textures.wood
    },

    leaves:{
        name:"Leaves",
        texture:ASSETS.textures.leaves,
        transparent:true
    },

    glass:{
        name:"Glass",
        texture:ASSETS.textures.glass,
        transparent:true
    },

    brick:{
        name:"Brick",
        texture:ASSETS.textures.brick
    },

    door:{
        name:"Door",
        texture:ASSETS.textures.door
    },

    water:{
        name:"Water",
        texture:ASSETS.textures.water,
        transparent:true,
        opacity:.72
    }
};

const HOTBAR = [
    "grass",
    "dirt",
    "stone",
    "sand",
    "wood",
    "leaves",
    "glass",
    "brick",
    "door"
];

let selectedBlock = 0;


/* =========================================================
   MATERIALS
   ========================================================= */

const materialCache = {};

function getMaterial(type){

    if(materialCache[type]){
        return materialCache[type];
    }

    const data = BLOCKS[type];

    if(!data){
        return new THREE.MeshLambertMaterial({
            color:0xff00ff
        });
    }

    const tex = loadTexture(data.texture);

    tex.colorSpace = THREE.SRGBColorSpace;

    const material =
        new THREE.MeshLambertMaterial({
            map:tex,
            transparent:!!data.transparent,
            opacity:data.opacity || 1,
            alphaTest:data.transparent ? .08 : 0,
            side:data.transparent
                ? THREE.DoubleSide
                : THREE.FrontSide
        });

    materialCache[type] = material;

    return material;
}


/* =========================================================
   WORLD
   ========================================================= */

const CHUNK_SIZE = 16;
const WORLD_HEIGHT = 32;

const LOAD_DISTANCE = 3;

const world = new Map();
const chunkGroups = new Map();
const generatedChunks = new Set();

let worldSeed =
    Math.floor(Math.random()*999999999);

function key(x,y,z){
    return `${x},${y},${z}`;
}

function chunkKey(cx,cz){
    return `${cx},${cz}`;
}

function getBlock(x,y,z){

    return world.get(key(
        Math.floor(x),
        Math.floor(y),
        Math.floor(z)
    ));
}

function setBlock(x,y,z,type){

    x=Math.floor(x);
    y=Math.floor(y);
    z=Math.floor(z);

    if(y<0 || y>=WORLD_HEIGHT) return;

    world.set(
        key(x,y,z),
        type
    );
}


/* =========================================================
   DETERMINISTIC RANDOM
   ========================================================= */

function hash2D(x,z){

    let n =
        x * 374761393 +
        z * 668265263 +
        worldSeed * 1442695041;

    n =
        (n ^ (n >>> 13)) *
        1274126177;

    n ^= n >>> 16;

    return (n >>> 0) / 4294967295;
}

function smoothNoise(x,z){

    const x0=Math.floor(x);
    const z0=Math.floor(z);

    const xf=x-x0;
    const zf=z-z0;

    const a=hash2D(x0,z0);
    const b=hash2D(x0+1,z0);
    const c=hash2D(x0,z0+1);
    const d=hash2D(x0+1,z0+1);

    const u=xf*xf*(3-2*xf);
    const v=zf*zf*(3-2*zf);

    return THREE.MathUtils.lerp(
        THREE.MathUtils.lerp(a,b,u),
        THREE.MathUtils.lerp(c,d,u),
        v
    );
}

function terrainHeight(x,z){

    const n1=smoothNoise(x*.035,z*.035);
    const n2=smoothNoise(x*.09,z*.09);
    const n3=smoothNoise(x*.18,z*.18);

    let h =
        7 +
        n1*10 +
        n2*3 +
        n3*1.2;

    return Math.max(
        2,
        Math.min(22,Math.floor(h))
    );
}


/* =========================================================
   CHUNK GENERATION
   ========================================================= */

function generateChunk(cx,cz){

    const ck=chunkKey(cx,cz);

    if(generatedChunks.has(ck)){
        return;
    }

    generatedChunks.add(ck);

    const startX=cx*CHUNK_SIZE;
    const startZ=cz*CHUNK_SIZE;

    for(let lx=0;lx<CHUNK_SIZE;lx++){

        for(let lz=0;lz<CHUNK_SIZE;lz++){

            const x=startX+lx;
            const z=startZ+lz;

            const h=terrainHeight(x,z);

            for(let y=0;y<=h;y++){

                let type="stone";

                if(y===h){

                    type =
                        h<=5
                        ? "sand"
                        : "grass";

                }else if(y>h-3){

                    type="dirt";
                }

                setBlock(x,y,z,type);
            }

            /*
             * WATER
             */
            const WATER_LEVEL=6;

            if(h < WATER_LEVEL){

                for(
                    let y=h+1;
                    y<=WATER_LEVEL;
                    y++
                ){
                    setBlock(x,y,z,"water");
                }
            }

            /*
             * TREES
             */
            if(
                h>7 &&
                hash2D(x+1000,z+2000)>.965
            ){

                generateTree(x,h+1,z);
            }
        }
    }

    /*
     * Random village
     */
    if(
        hash2D(cx*17+5000,cz*23+8000)>.94
    ){
        generateVillage(
            startX+7,
            startZ+7
        );
    }

    buildChunkMeshes(cx,cz);
}


/* =========================================================
   TREE
   ========================================================= */

function generateTree(x,y,z){

    const trunk=4;

    for(let i=0;i<trunk;i++){

        if(!getBlock(x,y+i,z)){
            setBlock(x,y+i,z,"wood");
        }
    }

    for(let dx=-2;dx<=2;dx++){

        for(let dz=-2;dz<=2;dz++){

            for(let dy=2;dy<=4;dy++){

                if(
                    Math.abs(dx)+
                    Math.abs(dz)+
                    Math.abs(dy-3)
                    <5
                ){

                    if(!getBlock(
                        x+dx,
                        y+dy,
                        z+dz
                    )){
                        setBlock(
                            x+dx,
                            y+dy,
                            z+dz,
                            "leaves"
                        );
                    }
                }
            }
        }
    }
}


/* =========================================================
   VILLAGE
   ========================================================= */

function generateVillage(x,z){

    const ground=terrainHeight(x,z);

    /*
     * Only generate on reasonably flat land
     */
    if(ground<7) return;

    for(let i=0;i<3;i++){

        const hx=x+(i%2)*9;
        const hz=z+Math.floor(i/2)*9;

        generateHouse(
            hx,
            ground+1,
            hz
        );
    }

    /*
     * Village path
     */
    for(let p=-8;p<=25;p++){

        const py=terrainHeight(
            Math.floor(x+p),
            z+4
        );

        setBlock(
            Math.floor(x+p),
            py+1,
            Math.floor(z+4),
            "brick"
        );
    }
}

function generateHouse(x,y,z){

    const width=6;
    const depth=6;
    const height=4;

    /*
     * Floor
     */
    for(let dx=0;dx<width;dx++){

        for(let dz=0;dz<depth;dz++){

            setBlock(
                x+dx,
                y,
                z+dz,
                "wood"
            );
        }
    }

    /*
     * Walls
     */
    for(let yy=1;yy<=height;yy++){

        for(let dx=0;dx<width;dx++){

            setBlock(
                x+dx,
                y+yy,
                z,
                "brick"
            );

            setBlock(
                x+dx,
                y+yy,
                z+depth-1,
                "brick"
            );
        }

        for(let dz=0;dz<depth;dz++){

            setBlock(
                x,
                y+yy,
                z+dz,
                "brick"
            );

            setBlock(
                x+width-1,
                y+yy,
                z+dz,
                "brick"
            );
        }
    }

    /*
     * Door
     */
    setBlock(
        x+Math.floor(width/2),
        y+1,
        z,
        "door"
    );

    /*
     * Roof
     */
    for(let dx=-1;dx<=width;dx++){

        for(let dz=-1;dz<=depth;dz++){

            setBlock(
                x+dx,
                y+height+1,
                z+dz,
                "wood"
            );
        }
    }
}


/* =========================================================
   CHUNK MESHES
   ========================================================= */

const cubeGeometry =
    new THREE.BoxGeometry(1,1,1);

function buildChunkMeshes(cx,cz){

    const ck=chunkKey(cx,cz);

    const old=chunkGroups.get(ck);

    if(old){

        scene.remove(old);

    }

    const group=new THREE.Group();

    const startX=cx*CHUNK_SIZE;
    const startZ=cz*CHUNK_SIZE;

    for(let x=startX;x<startX+CHUNK_SIZE;x++){

        for(let z=startZ;z<startZ+CHUNK_SIZE;z++){

            for(let y=0;y<WORLD_HEIGHT;y++){

                const type=getBlock(x,y,z);

                if(!type) continue;

                /*
                 * Don't create hidden interior blocks.
                 */
                if(
                    type!=="water" &&
                    isFullyCovered(x,y,z)
                ){
                    continue;
                }

                const material=getMaterial(type);

                const mesh=
                    new THREE.Mesh(
                        cubeGeometry,
                        material
                    );

                mesh.position.set(
                    x+.5,
                    y+.5,
                    z+.5
                );

                mesh.castShadow=true;
                mesh.receiveShadow=true;

                mesh.userData.block={
                    x,
                    y,
                    z,
                    type
                };

                group.add(mesh);
            }
        }
    }

    scene.add(group);

    chunkGroups.set(
        ck,
        group
    );
}

function isFullyCovered(x,y,z){

    const sides=[
        getBlock(x+1,y,z),
        getBlock(x-1,y,z),
        getBlock(x,y+1,z),
        getBlock(x,y-1,z),
        getBlock(x,y,z+1),
        getBlock(x,y,z-1)
    ];

    return sides.every(
        b=>b &&
        b!=="water" &&
        b!=="glass" &&
        b!=="leaves" &&
        b!=="door"
    );
}


/* =========================================================
   REMOVE OLD CHUNKS
   ========================================================= */

function updateChunks(){

    const cx=
        Math.floor(player.x/CHUNK_SIZE);

    const cz=
        Math.floor(player.z/CHUNK_SIZE);

    for(let dx=-LOAD_DISTANCE;dx<=LOAD_DISTANCE;dx++){

        for(let dz=-LOAD_DISTANCE;dz<=LOAD_DISTANCE;dz++){

            generateChunk(
                cx+dx,
                cz+dz
            );
        }
    }

    /*
     * Keep a practical active area.
     * This makes the world feel infinite without
     * keeping every generated mesh in memory.
     */
    for(const [ck,group] of chunkGroups){

        const parts=ck.split(",").map(Number);

        if(
            Math.abs(parts[0]-cx)>LOAD_DISTANCE+1 ||
            Math.abs(parts[1]-cz)>LOAD_DISTANCE+1
        ){

            scene.remove(group);
        }
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

const player={

    x:0,
    y:18,
    z:0,

    vx:0,
    vy:0,
    vz:0,

    yaw:0,
    pitch:0,

    height:1.8,
    radius:.3,

    speed:5.5,
    sprintSpeed:8,

    onGround:false
};

/* =========================================================
   COLLISION
   ========================================================= */

function solidAt(x,y,z){

    const b=getBlock(
        Math.floor(x),
        Math.floor(y),
        Math.floor(z)
    );

    return (
        b &&
        b!=="water" &&
        b!=="leaves" &&
        b!=="glass"
    );
}

function collides(px,py,pz){

    const r=player.radius;

    const minX=Math.floor(px-r);
    const maxX=Math.floor(px+r);

    const minY=Math.floor(py);
    const maxY=Math.floor(py+player.height);

    const minZ=Math.floor(pz-r);
    const maxZ=Math.floor(pz+r);

    for(let x=minX;x<=maxX;x++){

        for(let y=minY;y<=maxY;y++){

            for(let z=minZ;z<=maxZ;z++){

                const b=getBlock(x,y,z);

                if(
                    b &&
                    b!=="water" &&
                    b!=="leaves" &&
                    b!=="glass"
                ){
                    return true;
                }
            }
        }
    }

    return false;
}

function groundCheck(){

    const testY=player.y-.08;

    if(collides(
        player.x,
        testY,
        player.z
    )){
        return true;
    }

    return false;
}

/* =========================================================
   TARGET RAYCAST
   ========================================================= */

const raycaster=new THREE.Raycaster();

function getTarget(){

    raycaster.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );

    const objects=[];

    for(const group of chunkGroups.values()){

        objects.push(...group.children);
    }

    const hits=
        raycaster.intersectObjects(
            objects,
            false
        );

    if(!hits.length){
        return null;
    }

    const hit=hits[0];

    if(hit.distance>7){
        return null;
    }

    return hit;
}


/* =========================================================
   BREAK BLOCK
   ========================================================= */

function breakTargetBlock(){

    const hit=getTarget();

    if(!hit) return;

    const b=hit.object.userData.block;

    if(!b) return;

    /*
     * Don't allow breaking below world.
     */
    if(b.y<=0) return;

    setBlock(
        b.x,
        b.y,
        b.z,
        null
    );

    playBreakSound();

    rebuildAround(
        b.x,
        b.z
    );

    showToast(
        "Block broken"
    );
}


/* =========================================================
   PLACE BLOCK
   ========================================================= */

function placeBlock(){

    const hit=getTarget();

    if(!hit || !hit.face) return;

    const b=hit.object.userData.block;

    if(!b) return;

    const normal=
        hit.face.normal.clone();

    const x=
        b.x+
        Math.round(normal.x);

    const y=
        b.y+
        Math.round(normal.y);

    const z=
        b.z+
        Math.round(normal.z);

    if(y<0 || y>=WORLD_HEIGHT){
        return;
    }

    const type=
        HOTBAR[selectedBlock];

    /*
     * Door gets special handling.
     */
    if(type==="door"){

        if(
            !getBlock(x,y,z) &&
            !getBlock(x,y+1,z)
        ){

            setBlock(
                x,y,z,
                "door"
            );

            setBlock(
                x,y+1,z,
                "door"
            );

            rebuildAround(x,z);

            showToast("Door placed");
        }

        return;
    }

    if(!getBlock(x,y,z)){

        /*
         * Don't let player place block inside himself.
         */
        const old=player.y;

        if(
            x===Math.floor(player.x) &&
            z===Math.floor(player.z) &&
            y>=Math.floor(player.y) &&
            y<=Math.floor(player.y+player.height)
        ){
            return;
        }

        setBlock(
            x,y,z,type
        );

        rebuildAround(x,z);

        showToast(
            BLOCKS[type].name+
            " placed"
        );
    }
}


/* =========================================================
   DOOR OPEN / CLOSE
   ========================================================= */

function toggleDoor(){

    const hit=getTarget();

    if(!hit) return;

    const b=hit.object.userData.block;

    if(!b || b.type!=="door") return;

    /*
     * Door state is stored separately.
     */
    const dk=key(
        b.x,
        b.y,
        b.z
    );

    if(openDoors.has(dk)){

        openDoors.delete(dk);
        showToast("Door closed");

    }else{

        openDoors.add(dk);
        showToast("Door opened");
    }

    updateDoorVisuals();
}

const openDoors=new Set();

function updateDoorVisuals(){

    for(const group of chunkGroups.values()){

        for(const mesh of group.children){

            const b=mesh.userData.block;

            if(!b || b.type!=="door") continue;

            const dk=key(
                b.x,
                b.y,
                b.z
            );

            if(openDoors.has(dk)){

                mesh.rotation.y=
                    Math.PI/2;

            }else{

                mesh.rotation.y=0;
            }
        }
    }
}


/* =========================================================
   REBUILD NEARBY CHUNKS
   ========================================================= */

function rebuildAround(x,z){

    const cx=
        Math.floor(x/CHUNK_SIZE);

    const cz=
        Math.floor(z/CHUNK_SIZE);

    for(let dx=-1;dx<=1;dx++){

        for(let dz=-1;dz<=1;dz++){

            if(
                generatedChunks.has(
                    chunkKey(
                        cx+dx,
                        cz+dz
                    )
                )
            ){

                buildChunkMeshes(
                    cx+dx,
                    cz+dz
                );
            }
        }
    }

    updateDoorVisuals();
}


/* =========================================================
   PLAYER MOVEMENT
   ========================================================= */

let walking=false;

function updatePlayer(dt){

    if(!gameStarted || paused){
        stopWalkSound();
        return;
    }

    let forward=0;
    let side=0;

    if(keys.KeyW) forward+=1;
    if(keys.KeyS) forward-=1;
    if(keys.KeyD) side+=1;
    if(keys.KeyA) side-=1;

    /*
     * Mobile joystick
     */
    forward += mobileForward;
    side += mobileSide;

    const length=
        Math.hypot(
            forward,
            side
        );

    if(length>1){

        forward/=length;
        side/=length;
    }

    const sprint=
        keys.ShiftLeft ||
        keys.ShiftRight ||
        mobileSprint;

    const speed=
        sprint
        ? player.sprintSpeed
        : player.speed;

    /*
     * Minecraft-like movement direction.
     */
    const sin=Math.sin(player.yaw);
    const cos=Math.cos(player.yaw);

    const dx=
        (-sin*forward)+
        (cos*side);

    const dz=
        (-cos*forward)-
        (sin*side);

    const targetVX=dx*speed;
    const targetVZ=dz*speed;

    player.vx=
        THREE.MathUtils.lerp(
            player.vx,
            targetVX,
            Math.min(1,dt*12)
        );

    player.vz=
        THREE.MathUtils.lerp(
            player.vz,
            targetVZ,
            Math.min(1,dt*12)
        );

    /*
     * Gravity
     */
    player.vy-=22*dt;

    /*
     * X collision
     */
    const nx=
        player.x+
        player.vx*dt;

    if(!collides(nx,player.y,player.z)){

        player.x=nx;

    }else{

        player.vx=0;
    }

    /*
     * Z collision
     */
    const nz=
        player.z+
        player.vz*dt;

    if(!collides(player.x,player.y,nz)){

        player.z=nz;

    }else{

        player.vz=0;
    }

    /*
     * Y collision
     */
    const ny=
        player.y+
        player.vy*dt;

    if(!collides(player.x,ny,player.z)){

        player.y=ny;
        player.onGround=false;

    }else{

        if(player.vy<0){

            /*
             * Move upward until collision edge.
             */
            player.onGround=true;
        }

        player.vy=0;
    }

    /*
     * Prevent falling forever.
     */
    if(player.y<-20){

        player.y=
            terrainHeight(
                Math.floor(player.x),
                Math.floor(player.z)
            )+2;

        player.vy=0;
    }

    const moving=
        length>.05 &&
        player.onGround;

    if(moving){

        startWalkSound();

    }else{

        stopWalkSound();
    }

    camera.position.set(
        player.x,
        player.y+1.62,
        player.z
    );

    camera.rotation.y=player.yaw;
    camera.rotation.x=player.pitch;
}


/* =========================================================
   AUDIO
   ========================================================= */

let walkAudio=null;
let breakAudio=null;
let backAudio=null;

let audioStarted=false;

function createAudio(){

    if(walkAudio) return;

    walkAudio=
        new Audio(ASSETS.sounds.walk);

    breakAudio=
        new Audio(ASSETS.sounds.break);

    backAudio=
        new Audio(ASSETS.sounds.back);

    walkAudio.loop=true;
    backAudio.loop=true;

    walkAudio.volume=.35;
    breakAudio.volume=.65;
    backAudio.volume=.28;

    walkAudio.preload="auto";
    breakAudio.preload="auto";
    backAudio.preload="auto";
}

function startGameAudio(){

    createAudio();

    if(
        !backAudio.paused
    ){
        backAudio.pause();
    }

    audioStarted=true;
}

function startHomeMusic(){

    createAudio();

    backAudio.play().catch(()=>{
        /*
         * Browser autoplay protection.
         * It will retry on next user interaction.
         */
    });
}

function startWalkSound(){

    if(!audioStarted) return;

    if(
        walkAudio &&
        walkAudio.paused
    ){

        walkAudio.currentTime=0;

        walkAudio.play().catch(()=>{});
    }

    walking=true;
}

function stopWalkSound(){

    if(!walkAudio) return;

    if(!walkAudio.paused){

        walkAudio.pause();
        walkAudio.currentTime=0;
    }

    walking=false;
}

function playBreakSound(){

    createAudio();

    breakAudio.currentTime=0;

    breakAudio.play().catch(()=>{
        /*
         * If browser has not unlocked audio,
         * the next interaction will unlock it.
         */
    });
}


/*
 * Unlock audio on first interaction.
 */
["pointerdown","keydown","touchstart"].forEach(type=>{

    document.addEventListener(

        }
    );
});

function updateHotbar(){

    hotbar.innerHTML="";

    HOTBAR.forEach(
        (type,i)=>{

            const slot=
                document.createElement("div");

            slot.className=
                "slot"+
                (
                    i===selectedBlock

                );

            const img=
                document.createElement("img");

            img.onerror=()=>{

            };

            const num=
                document.createElement("div");

            num.className="slotNum";
            num.textContent=i+1;

            slot.appendChild(img);

            slot.addEventListener(
                "click",
                ()=>{
                    selectedBlock=i;
                    updateHotbar();
                }
            );

            hotbar.appendChild(slot);
        }
    );
}

/* =========================================================
   MOBILE JOYSTICK
   ========================================================= */

let mobileForward=0;
let mobileSide=0;
let mobileSprint=false;

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joyActive=false;

joystick.addEventListener(
    "touchstart",
    e=>{
        joyActive=true;
        updateJoystick(e.touches[0]);
    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e=>{
        if(!joyActive) return;

        updateJoystick(
            e.touches[0]
        );

        e.preventDefault();
    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    ()=>{
        joyActive=false;

        mobileForward=0;
        mobileSide=0;

        stick.style.left="33px";
        stick.style.top="33px";
    }
);

function updateJoystick(touch){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+r.width/2;

    const cy=
        r.top+r.height/2;

    let dx=
        touch.clientX-cx;

    let dy=
        touch.clientY-cy;

    const max=45;

    const len=
        Math.hypot(dx,dy);

    if(len>max){

        dx=
            dx/len*max;

        dy=
            dy/len*max;
    }

    stick.style.left=
        (33+dx)+"px";

    stick.style.top=
        (33+dy)+"px";

    mobileSide=
        dx/max;

    mobileForward=
        -dy/max;
}

const lookArea=

let lookTouch=null;

lookArea.addEventListener(
    "touchstart",
    e=>{

        if(e.touches.length){

            lookTouch={
                id:e.touches[0].identifier,
                x:e.touches[0].clientX,
                y:e.touches[0].clientY
            };
        }
    },
    {passive:true}
);

    "touchmove",
    e=>{

        if(!lookTouch) return;

        for(const touch of e.touches){

            if(
                touch.identifier===
                lookTouch.id
            ){

                const dx=
                    touch.clientX-lookTouch.x;

                const dy=
                    touch.clientY-lookTouch.y;

                player.yaw-=dx*.006;
                player.pitch-=dy*.006;

                player.pitch=
                    Math.max(
                        -Math.PI/2+.05,
                        Math.min(
                            Math.PI/2-.05,
                            player.pitch
                        )
                    );

                lookTouch.x=
                    touch.clientX;

                lookTouch.y=
                    touch.clientY;

                break;
            }
        }
    },
    {passive:true}
);

    ()=>{
        lookTouch=null;
    }
);

/* =========================================================
   SAVE / LOAD
   ========================================================= */

function saveWorld(){

    const data={
        seed:worldSeed,
        blocks:Object.fromEntries(world),
        player:{
            x:player.x,
            y:player.y,
            z:player.z,
            yaw:player.yaw,
            pitch:player.pitch
        }
    };

    try{

        localStorage.setItem(
            "rishantcraft_world",
            JSON.stringify(data)
        );

        showToast(
            "World saved"
        );

    }catch(e){

        console.error(e);

        showToast(
            "Save failed"
        );
    }
}

function loadWorld(){

    try{

        const raw=
            localStorage.getItem(
                "rishantcraft_world"
            );

        if(!raw) return false;

        const data=
            JSON.parse(raw);

        if(data.seed){
            worldSeed=data.seed;
        }

        world.clear();
        generatedChunks.clear();

        for(
            const [k,v]
            of Object.entries(
                data.blocks || {}
            )
        ){

            world.set(k,v);
        }

        if(data.player){

            player.x=data.player.x;
            player.y=data.player.y;
            player.z=data.player.z;

            player.yaw=
                data.player.yaw || 0;

            player.pitch=
                data.player.pitch || 0;
        }

        return true;

    }catch(e){

        console.error(
            "Load error:",
            e
        );

        return false;
    }
}

document.getElementById(
    "saveBtn"
).onclick=saveWorld;

function newWorld(){

        Math.floor(
            Math.random()*999999999
        );

    world.clear();
    generatedChunks.clear();

    for(
        const group
        of chunkGroups.values()
    ){
        scene.remove(group);
    }

    chunkGroups.clear();

    player.x=0;
    player.z=0;

    player.y=
        terrainHeight(0,0)+3;

    player.vx=0;
    player.vy=0;
    player.vz=0;

    showToast(
        "New world created"
    );
}


/* =========================================================
   START GAME
   ========================================================= */

let gameStarted=false;

const menu=
    document.getElementById("menu");

const hud=
    document.getElementById("hud");

const loading=
    document.getElementById("loading");

async function startGame(isNew=false){

    loading.style.display="flex";

    createAudio();

    if(isNew){

        newWorld();

    }else{

        const loaded=loadWorld();

        if(!loaded){

            worldSeed=
                Math.floor(
                    Math.random()*999999999
                );

            player.x=0;
            player.z=0;

            player.y=
                terrainHeight(0,0)+3;
        }
    }

    /*
     * Make initial chunks.
     */
    updateChunks();

    camera.position.set(
        player.x,
        player.y+1.62,
        player.z
    );

    menu.style.display="none";
    hud.style.display="block";

    gameStarted=true;
    paused=false;

    /*
     * Home music stops when entering game.
     */
    if(backAudio){
        backAudio.pause();
        backAudio.currentTime=0;
    }

    /*
     * Audio must be triggered after user gesture.
     */
    audioStarted=true;

    loading.style.display="none";

    showToast(
        "Welcome to RishantCraft!"
    );

    if(!isMobile()){

        canvas.requestPointerLock?.();
    }
}

document.getElementById(
    "playBtn"
).onclick=()=>{
    startGame(false);
};

document.getElementById(
    "newBtn"
).onclick=()=>{
    startGame(true);
};

document.getElementById(
    "mainMenuBtn"
).onclick=()=>{

    saveWorld();

    paused=false;
    gameStarted=false;

    stopWalkSound();

    if(document.pointerLockElement){
        document.exitPointerLock();
    }

    document.getElementById(
        "pauseMenu"
    ).style.display="none";

    hud.style.display="none";
    menu.style.display="flex";

    startHomeMusic();
};

/* =========================================================
   VILLAGERS
   ========================================================= */

const villagers=[];

function spawnVillager(x,y,z){

    /*
     * First try FBX model.
     */
    if(
        typeof THREE.FBXLoader!=="undefined"
    ){

        const loader=
            new THREE.FBXLoader();

        loader.load(
            ASSETS.villagerModel,
            object=>{

                object.scale.set(
                    .012,
                    .012,
                    .012
                );

                object.position.set(
                    x,
                    y,
                    z
                );

                object.traverse(
                    child=>{
                        if(child.isMesh){

                            child.castShadow=true;
                            child.receiveShadow=true;

                            /*
                             * If model has no material texture,
                             * apply villager.png.
                             */
                            if(
                                !child.material ||
                                !child.material.map
                            ){

                                child.material=
                                    new THREE.MeshLambertMaterial({
                                        map:loadTexture(
                                            ASSETS.textures.villager
                                        )
                                    });
                            }
                        }
                    }
                );

                scene.add(object);

                villagers.push({
                    object,
                    x,
                    y,
                    z,
                    angle:Math.random()*Math.PI*2,
                    timer:Math.random()*5
                });
            },
            undefined,
            ()=>{
                /*
                 * Fallback villager
                 */
                createVillagerSprite(
                    x,y,z
                );
            }
        );

    }else{

        createVillagerSprite(x,y,z);
    }
}


/*
 * Fallback villager using villager.png.
 */
function createVillagerSprite(x,y,z){

    const mat=
        new THREE.SpriteMaterial({
            map:loadTexture(
                ASSETS.textures.villager
            ),
            transparent:true
        });

    const sprite=
        new THREE.Sprite(mat);

    sprite.position.set(
        x,
        y+1,
        z
    );

    sprite.scale.set(
        1.3,
        2,
        1
    );

    scene.add(sprite);

    villagers.push({
        object:sprite,
        x,
        y:y+1,
        z,
        angle:Math.random()*Math.PI*2,
        timer:Math.random()*5
    });
}


/* =========================================================
   RANDOM VILLAGER SPAWN
   ========================================================= */

function spawnVillageVillagers(){

    /*
     * Spawn a few villagers near the player
     * in suitable terrain locations.
     */
    for(let i=0;i<8;i++){

        const angle=
            Math.random()*Math.PI*2;

        const distance=
            25+
            Math.random()*35;

        const x=
            Math.floor(
                player.x+
                Math.cos(angle)*distance
            );

        const z=
            Math.floor(
                player.z+
                Math.sin(angle)*distance
            );

        const y=
            terrainHeight(x,z)+1;

        if(y>8){

            spawnVillager(
                x,
                y,
                z
            );
        }
    }
}


/* =========================================================
   VILLAGER AI
   ========================================================= */

function updateVillagers(dt){

    for(const v of villagers){

        v.timer-=dt;

        if(v.timer<=0){

            v.angle=
                Math.random()*
                Math.PI*2;

            v.timer=
                2+
                Math.random()*5;
        }

        const speed=.35;

        v.x+=
            Math.cos(v.angle)*
            speed*dt;

        v.z+=
            Math.sin(v.angle)*
            speed*dt;

        const ground=
            terrainHeight(
                Math.floor(v.x),
                Math.floor(v.z)
            );

        v.y=
            ground+1;

        v.object.position.set(
            v.x,
            v.y,
            v.z
        );

        /*
         * Model faces direction.
         */
        if(v.object.rotation){
            v.object.rotation.y=
                -v.angle;
        }
    }
}


/* =========================================================
   DAY / NIGHT
   ========================================================= */

let worldTime=.22;

function updateDayNight(dt){

    worldTime+=dt*.008;

    if(worldTime>1){
        worldTime=0;
    }

    const angle=
        worldTime*Math.PI*2;

    const sunY=
        Math.sin(angle);

    const sunX=
        Math.cos(angle);

    sun.position.set(
        sunX*80,
        sunY*100,
        30
    );

    const daylight=
        Math.max(
            .12,
            sunY*.75+.35
        );

    sun.intensity=
        daylight*2;

    hemi.intensity=
        .45+
        daylight;

    const sky=
        new THREE.Color();

    if(sunY>0){

        sky.setHSL(
            .58,
            .55,
            .55+
            daylight*.15
        );

    }else{

        sky.setHSL(
            .67,
            .35,
            .10
        );
    }

    scene.background.copy(sky);
    scene.fog.color.copy(sky);
}


/* =========================================================
   WATER ANIMATION
   ========================================================= */

let waterTime=0;

function updateWater(dt){

    waterTime+=dt;

    const water=
        materialCache.water;

    if(water && water.map){

        water.map.offset.x=
            waterTime*.015;

        water.map.offset.y=
            waterTime*.008;
    }
}


/* =========================================================
   FPS / HUD
   ========================================================= */

let fpsFrames=0;
let fpsTime=0;
let currentFPS=60;

function updateHUD(dt){

    fpsFrames++;
    fpsTime+=dt;

    if(fpsTime>=1){

        currentFPS=fpsFrames;

        fpsFrames=0;
        fpsTime=0;

        document.getElementById(
            "fps"
        ).textContent=
            "FPS: "+currentFPS;
    }

    document.getElementById(
        "coords"
    ).textContent=
        "XYZ: "+
        Math.floor(player.x)+
        " "+
        Math.floor(player.y)+
        " "+
        Math.floor(player.z);
}


/* =========================================================
   RESIZE
   ========================================================= */

addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   MOBILE DETECTION
   ========================================================= */

function isMobile(){

    return (
        /Android|iPhone|iPad|iPod/i.test(
            navigator.userAgent
        ) ||
        innerWidth<800
    );
}


/* =========================================================
   AUTOSAVE
   ========================================================= */

setInterval(
    ()=>{
        if(gameStarted){
            saveWorld();
        }
    },
    30000
);


/* =========================================================
   GAME LOOP
   ========================================================= */

let lastTime=
    performance.now();

let chunkTimer=0;
let villagerTimer=0;

function animate(){

    requestAnimationFrame(animate);

    const now=
        performance.now();

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(dt,.05);

    if(gameStarted && !paused){

        updatePlayer(dt);

        updateDayNight(dt);

        updateWater(dt);

        updateVillagers(dt);

        chunkTimer+=dt;

        if(chunkTimer>.8){

            updateChunks();

            chunkTimer=0;
        }

        villagerTimer+=dt;

        if(
            villagerTimer>20 &&
            villagers.length<12
        ){

            spawnVillageVillagers();

            villagerTimer=0;
        }

        updateHUD(dt);
    }

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   INITIAL WORLD
   ========================================================= */

updateHotbar();

/*
 * Generate initial small area so
 * background is ready.
 */
worldSeed=
    Math.floor(
        Math.random()*999999999
    );

for(let cx=-1;cx<=1;cx++){

    for(let cz=-1;cz<=1;cz++){

        generateChunk(cx,cz);
    }
}

/*
 * Put player above spawn.
 */
player.y=
    terrainHeight(0,0)+3;


/*
 * Start home screen music after user interaction.
 */
document.addEventListener(
    "click",
    ()=>{
        if(!gameStarted){
            startHomeMusic();
        }
    },
    {passive:true}
);


/* =========================================================
   START
   ========================================================= */

animate();

</script>
